<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="grp-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2e2822"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
    <radialGradient id="grp-dish-top" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d4a444"/>
      <stop offset="40%" stop-color="#b8841e"/>
      <stop offset="100%" stop-color="#7a5010"/>
    </radialGradient>
    <radialGradient id="grp-crust" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8c060"/>
      <stop offset="50%" stop-color="#c49030"/>
      <stop offset="100%" stop-color="#8a6018"/>
    </radialGradient>
    <linearGradient id="grp-dish-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4530"/>
      <stop offset="100%" stop-color="#3a2a18"/>
    </linearGradient>
    <linearGradient id="grp-dish-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a7060"/>
      <stop offset="100%" stop-color="#5a4535"/>
    </linearGradient>
    <linearGradient id="grp-cream-layer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#ddd5c0"/>
    </linearGradient>
    <filter id="grp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a0805" flood-opacity="0.7"/>
    </filter>
    <filter id="grp-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#grp-bg)"/>

  <!-- Ambient warm light on table surface -->
  <ellipse cx="400" cy="480" rx="320" ry="60" fill="#3a2a15" opacity="0.5"/>

  <!-- Gratin dish body (ceramic white dish) -->
  <g filter="url(#grp-shadow)">
    <!-- Dish outer shape -->
    <rect x="160" y="300" width="480" height="180" rx="18" ry="18" fill="url(#grp-dish-rim)"/>
    <!-- Dish handles -->
    <ellipse cx="155" cy="390" rx="28" ry="14" fill="#9a8570"/>
    <ellipse cx="645" cy="390" rx="28" ry="14" fill="#9a8570"/>
    <ellipse cx="155" cy="388" rx="20" ry="9" fill="#b0997f"/>
    <ellipse cx="645" cy="388" rx="20" ry="9" fill="#b0997f"/>
    <!-- Dish interior -->
    <rect x="172" y="312" width="456" height="162" rx="12" ry="12" fill="url(#grp-dish-body)"/>
  </g>

  <!-- Raviole layers visible on the sides (pasta squares pattern) -->
  <!-- Layer 1 - bottom cream layer -->
  <rect x="180" y="390" width="440" height="18" rx="3" fill="url(#grp-cream-layer)" opacity="0.7"/>
  <!-- Pasta layer 1 squares -->
  <g opacity="0.85">
    <rect x="182" y="370" width="36" height="20" rx="2" fill="#e8d8a0"/>
    <rect x="222" y="370" width="36" height="20" rx="2" fill="#dfd098"/>
    <rect x="262" y="370" width="36" height="20" rx="2" fill="#e8d8a0"/>
    <rect x="302" y="370" width="36" height="20" rx="2" fill="#dfd098"/>
    <rect x="342" y="370" width="36" height="20" rx="2" fill="#e8d8a0"/>
    <rect x="382" y="370" width="36" height="20" rx="2" fill="#dfd098"/>
    <rect x="422" y="370" width="36" height="20" rx="2" fill="#e8d8a0"/>
    <rect x="462" y="370" width="36" height="20" rx="2" fill="#dfd098"/>
    <rect x="502" y="370" width="36" height="20" rx="2" fill="#e8d8a0"/>
    <rect x="542" y="370" width="36" height="20" rx="2" fill="#dfd098"/>
    <rect x="582" y="370" width="36" height="20" rx="2" fill="#e8d8a0"/>
  </g>
  <!-- Leek strands between layers -->
  <g opacity="0.9">
    <path d="M190 362 Q240 356 290 360 Q340 355 390 359 Q440 354 490 358 Q540 353 590 357 Q620 354 614 358" stroke="#8db070" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M195 358 Q250 352 310 356 Q360 351 420 355 Q470 350 530 354 Q570 350 610 353" stroke="#9ebe80" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M200 364 Q260 360 310 363 Q370 358 430 362 Q480 357 540 361 Q575 357 608 360" stroke="#7aaa5a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M185 355 Q245 350 295 354 Q350 349 400 353 Q455 348 510 352 Q560 348 612 351" stroke="#b0d090" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Cream layer 2 -->
  <rect x="180" y="348" width="440" height="12" rx="2" fill="url(#grp-cream-layer)" opacity="0.6"/>
  <!-- Pasta layer 2 -->
  <g opacity="0.8">
    <rect x="185" y="328" width="36" height="20" rx="2" fill="#e5d595"/>
    <rect x="225" y="328" width="36" height="20" rx="2" fill="#dccf8e"/>
    <rect x="265" y="328" width="36" height="20" rx="2" fill="#e5d595"/>
    <rect x="305" y="328" width="36" height="20" rx="2" fill="#dccf8e"/>
    <rect x="345" y="328" width="36" height="20" rx="2" fill="#e5d595"/>
    <rect x="385" y="328" width="36" height="20" rx="2" fill="#dccf8e"/>
    <rect x="425" y="328" width="36" height="20" rx="2" fill="#e5d595"/>
    <rect x="465" y="328" width="36" height="20" rx="2" fill="#dccf8e"/>
    <rect x="505" y="328" width="36" height="20" rx="2" fill="#e5d595"/>
    <rect x="545" y="328" width="36" height="20" rx="2" fill="#dccf8e"/>
    <rect x="580" y="328" width="36" height="20" rx="2" fill="#e5d595"/>
  </g>
  <!-- Leek strands layer 2 -->
  <g opacity="0.85">
    <path d="M188 322 Q240 316 295 320 Q345 315 400 319 Q455 314 510 318 Q558 314 612 317" stroke="#8db070" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M193 318 Q248 313 300 317 Q358 312 415 316 Q465 311 520 315 Q565 311 610 314" stroke="#9ebe80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Golden gratin top crust -->
  <rect x="176" y="310" width="448" height="30" rx="8" fill="url(#grp-crust)"/>
  <!-- Browned spots on top -->
  <ellipse cx="230" cy="322" rx="28" ry="8" fill="#8a5510" opacity="0.6"/>
  <ellipse cx="320" cy="318" rx="22" ry="6" fill="#9a6018" opacity="0.55"/>
  <ellipse cx="420" cy="324" rx="30" ry="7" fill="#7a4a0c" opacity="0.65"/>
  <ellipse cx="520" cy="319" rx="24" ry="7" fill="#8a5510" opacity="0.5"/>
  <ellipse cx="600" cy="322" rx="20" ry="6" fill="#9a6018" opacity="0.55"/>
  <ellipse cx="270" cy="315" rx="16" ry="5" fill="#6a3e08" opacity="0.5"/>
  <ellipse cx="480" cy="316" rx="18" ry="5" fill="#7a4a0c" opacity="0.5"/>
  <!-- Golden highlight on crust -->
  <rect x="180" y="311" width="440" height="8" rx="5" fill="#f0d870" opacity="0.25"/>

  <!-- Steam wisps -->
  <g opacity="0.6" filter="url(#grp-glow)">
    <path d="M260 300 Q255 278 262 258 Q268 238 263 218" stroke="#e8e0d0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M350 298 Q342 272 350 248 Q357 224 350 202" stroke="#e8e0d0" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.45"/>
    <path d="M440 302 Q434 278 441 256 Q447 234 440 210" stroke="#e8e0d0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.35"/>
    <path d="M530 299 Q524 274 531 252 Q537 230 530 206" stroke="#e8e0d0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>
  <!-- Wider steam puffs -->
  <g opacity="0.3">
    <path d="M290 295 Q278 264 292 238 Q305 214 290 188" stroke="#f0ece4" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M480 293 Q470 265 482 240 Q494 215 480 190" stroke="#f0ece4" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Dish shadow on table -->
  <ellipse cx="400" cy="488" rx="250" ry="22" fill="#0d0a07" opacity="0.6"/>
</svg>

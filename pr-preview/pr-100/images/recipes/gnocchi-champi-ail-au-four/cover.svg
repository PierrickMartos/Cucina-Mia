  <path d="M200 390 Q280 370 360 395 Q440 420 520 388 Q580 368 630 385" stroke="#f0ece0" stroke-width="3" fill="none" opacity="0.45"/>
  <path d="M170 330 Q260 310 350 325 Q450 340 540 318 Q590 308 640 322" stroke="#f0ece0" stroke-width="2.5" fill="none" opacity="0.35"/>


  <ellipse cx="625" cy="352" rx="33" ry="14" fill="url(#gcaf-mushroom)" transform="rotate(-8,625,352)"/>
  <ellipse cx="625" cy="352" rx="26" ry="9" fill="#5a3010" transform="rotate(-8,625,352)"/>


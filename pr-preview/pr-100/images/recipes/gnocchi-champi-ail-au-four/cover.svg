  <ellipse cx="300" cy="332" rx="21" ry="8" fill="#e8d070" opacity="0.4"/>

  <ellipse cx="395" cy="332" rx="25" ry="14" fill="url(#gcaf-gnocchi1)"/>
  <ellipse cx="395" cy="326" rx="20" ry="7" fill="#e8d070" opacity="0.5"/>

  <ellipse cx="492" cy="336" rx="26" ry="14" fill="url(#gcaf-gnocchi2)"/>
  <ellipse cx="492" cy="330" rx="21" ry="8" fill="#e8d070" opacity="0.4"/>


  <ellipse cx="370" cy="435" rx="16" ry="11" fill="url(#gcaf-garlic)" transform="rotate(-15,370,435)"/>
  <ellipse cx="367" cy="432" rx="9" ry="5" fill="#e0d4a0" opacity="0.6"/>


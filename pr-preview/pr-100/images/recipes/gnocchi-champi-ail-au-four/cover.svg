  <ellipse cx="355" cy="255" rx="36" ry="13" fill="url(#gcaf-mushroom)" transform="rotate(-5,355,255)"/>
  <ellipse cx="355" cy="255" rx="28" ry="8" fill="#5a3010" transform="rotate(-5,355,255)"/>

  <ellipse cx="445" cy="258" rx="40" ry="14" fill="url(#gcaf-mushroom)" transform="rotate(12,445,258)"/>
  <ellipse cx="445" cy="258" rx="32" ry="9" fill="#5a3010" transform="rotate(12,445,258)"/>


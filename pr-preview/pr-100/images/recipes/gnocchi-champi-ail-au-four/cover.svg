<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="gcaf-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2e2822"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
    <radialGradient id="gcaf-tray" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6a6a6a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </radialGradient>
    <radialGradient id="gcaf-gnocchi1" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8c85a"/>
      <stop offset="100%" stop-color="#c89838"/>
    </radialGradient>
    <radialGradient id="gcaf-gnocchi2" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ddb848"/>
      <stop offset="100%" stop-color="#b88428"/>
    </radialGradient>
    <radialGradient id="gcaf-mushroom" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9a6030"/>
      <stop offset="100%" stop-color="#6a3a18"/>
    </radialGradient>
    <radialGradient id="gcaf-cream" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f0dc"/>
      <stop offset="70%" stop-color="#e8dcc0"/>
      <stop offset="100%" stop-color="#d4c8a0"/>
    </radialGradient>
    <radialGradient id="gcaf-garlic" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e8c0"/>
      <stop offset="100%" stop-color="#c8b878"/>
    </radialGradient>
    <filter id="gcaf-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="gcaf-steam" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>


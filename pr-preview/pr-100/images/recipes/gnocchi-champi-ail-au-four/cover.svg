  <ellipse cx="175" cy="360" rx="36" ry="15" fill="url(#gcaf-mushroom)" transform="rotate(15,175,360)"/>
  <ellipse cx="175" cy="360" rx="28" ry="10" fill="#5a3010" transform="rotate(15,175,360)"/>

  <ellipse cx="255" cy="375" rx="40" ry="16" fill="url(#gcaf-mushroom)" transform="rotate(-8,255,375)"/>
  <ellipse cx="255" cy="375" rx="32" ry="10" fill="#5a3010" transform="rotate(-8,255,375)"/>

  <ellipse cx="348" cy="382" rx="38" ry="15" fill="url(#gcaf-mushroom)" transform="rotate(5,348,382)"/>
  <ellipse cx="348" cy="382" rx="30" ry="10" fill="#5a3010" transform="rotate(5,348,382)"/>

  <ellipse cx="445" cy="378" rx="42" ry="16" fill="url(#gcaf-mushroom)" transform="rotate(-12,445,378)"/>

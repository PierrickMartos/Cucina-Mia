  <!-- Tray inner rim -->
  <rect x="128" y="203" width="544" height="254" rx="10" ry="10" fill="#2a2a2a"/>

  <!-- Cream sauce pool -->
  <ellipse cx="400" cy="325" rx="240" ry="108" fill="url(#gcaf-cream)" opacity="0.55"/>


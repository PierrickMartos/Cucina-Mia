  <path d="M280 200 Q275 180 282 162 Q289 144 284 128" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.18" filter="url(#gcaf-steam)"/>
  <path d="M400 192 Q393 170 400 150 Q407 130 401 112" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.15" filter="url(#gcaf-steam)"/>
  <path d="M520 198 Q527 178 520 158 Q513 138 519 120" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.18" filter="url(#gcaf-steam)"/>

  <!-- Tray handle left -->
  <rect x="72" y="300" width="48" height="22" rx="11" ry="11" fill="#4a4a4a"/>
  <rect x="76" y="304" width="40" height="14" rx="7" ry="7" fill="#5a5a5a"/>

  <!-- Tray handle right -->
  <rect x="680" y="300" width="48" height="22" rx="11" ry="11" fill="#4a4a4a"/>
  <rect x="684" y="304" width="40" height="14" rx="7" ry="7" fill="#5a5a5a"/>

  <!-- Subtle ambient glow over the dish -->
  <ellipse cx="400" cy="335" rx="230" ry="110" fill="#d4a030" opacity="0.06"/>

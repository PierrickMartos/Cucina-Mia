<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="tbg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2e2822"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
    <linearGradient id="tglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8e0d4" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#tbg)"/>
  <!-- Wood grain -->
  <g stroke="#2a2018" stroke-width="0.5" opacity="0.2">
    <path d="M0,100 Q200,95 400,102 Q600,108 800,100"/>
    <path d="M0,250 Q200,248 400,253 Q600,258 800,250"/>
    <path d="M0,400 Q200,396 400,402 Q600,408 800,400"/>
    <path d="M0,500 Q200,497 400,503 Q600,508 800,500"/>
  </g>
  <ellipse cx="405" cy="420" rx="220" ry="40" fill="#0d0a07" opacity="0.5"/>
  <!-- Glass dish -->
  <rect x="195" y="215" width="410" height="190" rx="14" fill="#3a3430" stroke="#5a5048" stroke-width="1.5"/>
  <rect x="195" y="215" width="410" height="190" rx="14" fill="url(#tglass)"/>
  <!-- Layer 1: Bottom savoiardi -->
  <rect x="205" y="345" width="390" height="50" rx="4" fill="#c89e60"/>
  <g stroke="#b08848" stroke-width="0.8" opacity="0.5">
    <line x1="245" y1="348" x2="245" y2="390"/><line x1="280" y1="348" x2="280" y2="390"/>
    <line x1="315" y1="348" x2="315" y2="390"/><line x1="350" y1="348" x2="350" y2="390"/>
    <line x1="385" y1="348" x2="385" y2="390"/><line x1="420" y1="348" x2="420" y2="390"/>
    <line x1="455" y1="348" x2="455" y2="390"/><line x1="490" y1="348" x2="490" y2="390"/>
    <line x1="525" y1="348" x2="525" y2="390"/><line x1="560" y1="348" x2="560" y2="390"/>
  </g>
  <rect x="205" y="345" width="390" height="50" rx="4" fill="#5a3820" opacity="0.4"/>
  <!-- Layer 2: Cream -->
  <rect x="205" y="293" width="390" height="56" rx="2" fill="#f8f0e2"/>
  <g fill="#f0e6d4" opacity="0.6">
    <ellipse cx="275" cy="318" rx="32" ry="6"/><ellipse cx="385" cy="313" rx="38" ry="7"/>
    <ellipse cx="490" cy="320" rx="30" ry="5"/>
  </g>
  <!-- Layer 3: Top savoiardi -->
  <rect x="205" y="252" width="390" height="46" rx="4" fill="#c89e60"/>
  <rect x="205" y="252" width="390" height="46" rx="4" fill="#5a3820" opacity="0.35"/>
  <g stroke="#b08848" stroke-width="0.8" opacity="0.35">
    <line x1="245" y1="256" x2="245" y2="294"/><line x1="280" y1="256" x2="280" y2="294"/>
    <line x1="315" y1="256" x2="315" y2="294"/><line x1="350" y1="256" x2="350" y2="294"/>
    <line x1="385" y1="256" x2="385" y2="294"/><line x1="420" y1="256" x2="420" y2="294"/>
    <line x1="455" y1="256" x2="455" y2="294"/><line x1="490" y1="256" x2="490" y2="294"/>
    <line x1="525" y1="256" x2="525" y2="294"/><line x1="560" y1="256" x2="560" y2="294"/>
  </g>
  <!-- Top cream -->
  <rect x="205" y="228" width="390" height="30" rx="8" fill="#faf4ea"/>
  <!-- Cocoa powder -->
  <rect x="203" y="218" width="394" height="22" rx="10" fill="#5a3018" opacity="0.88"/>
  <g fill="#4a2510" opacity="0.3">
    <circle cx="235" cy="228" r="3"/><circle cx="265" cy="225" r="2.5"/>
    <circle cx="300" cy="230" r="2"/><circle cx="340" cy="226" r="3"/>
    <circle cx="380" cy="229" r="2"/><circle cx="420" cy="225" r="2.5"/>
    <circle cx="460" cy="228" r="3"/><circle cx="500" cy="226" r="2"/>
    <circle cx="540" cy="229" r="2.5"/><circle cx="570" cy="225" r="2"/>
  </g>
  <!-- Cocoa scatter -->
  <g fill="#5a3018" opacity="0.12">
    <circle cx="178" cy="438" r="2"/><circle cx="625" cy="428" r="1.5"/>
    <circle cx="190" cy="415" r="1.2"/><circle cx="615" cy="443" r="1"/>
    <circle cx="295" cy="448" r="1.5"/><circle cx="505" cy="443" r="1.2"/>
    <circle cx="170" cy="450" r="1"/><circle cx="635" cy="410" r="1"/>
  </g>
  <!-- Glass reflection -->
  <rect x="197" y="228" width="5" height="155" rx="2.5" fill="white" opacity="0.06"/>

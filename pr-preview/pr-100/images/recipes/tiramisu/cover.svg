  <g transform="translate(620, 310) rotate(15)" opacity="0.4">
    <rect x="0" y="0" width="5" height="105" rx="2.5" fill="#c0b8a8"/>
    <ellipse cx="2.5" cy="-14" rx="20" ry="15" fill="#c0b8a8"/>
    <ellipse cx="2.5" cy="-14" rx="16" ry="11" fill="#b0a898"/>
  </g>
  <!-- Coffee cup hint -->
  <g transform="translate(660, 180)" opacity="0.2">
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="#4a3828"/>
    <rect x="-22" y="-2" width="44" height="25" rx="4" fill="#4a3828"/>
    <ellipse cx="0" cy="23" rx="22" ry="8" fill="#3a2818"/>
    <path d="M22,5 Q35,8 35,14 Q35,20 22,18" stroke="#4a3828" stroke-width="3" fill="none"/>

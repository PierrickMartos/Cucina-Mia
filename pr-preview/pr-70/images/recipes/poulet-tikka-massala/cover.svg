<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Background gradient: dark warm -->
    <radialGradient id="ptm-bg" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#3d1a0a"/>
      <stop offset="60%" stop-color="#1f0d05"/>
      <stop offset="100%" stop-color="#0d0603"/>
    </radialGradient>
    <!-- Bowl gradient -->
    <radialGradient id="ptm-bowl" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#5c3a28"/>
      <stop offset="100%" stop-color="#2e1a10"/>
    </radialGradient>
    <!-- Sauce gradient: deep orange-red tikka -->
    <radialGradient id="ptm-sauce" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e05b20"/>
      <stop offset="40%" stop-color="#c0441a"/>
      <stop offset="80%" stop-color="#9b3312"/>
      <stop offset="100%" stop-color="#7a2509"/>
    </radialGradient>
    <!-- Sauce shimmer highlight -->
    <radialGradient id="ptm-shimmer" cx="40%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#f47c3c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c0441a" stop-opacity="0"/>
    </radialGradient>
    <!-- Chicken piece gradient -->
    <radialGradient id="ptm-chicken1" cx="40%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e8b06a"/>
      <stop offset="60%" stop-color="#d4924a"/>
      <stop offset="100%" stop-color="#b87030"/>
    </radialGradient>
    <radialGradient id="ptm-chicken2" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#dda85e"/>
      <stop offset="60%" stop-color="#c98040"/>
      <stop offset="100%" stop-color="#a86028"/>
    </radialGradient>
    <radialGradient id="ptm-chicken3" cx="40%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e4ac65"/>
      <stop offset="60%" stop-color="#d08c48"/>
      <stop offset="100%" stop-color="#b87030"/>
    </radialGradient>
    <!-- Steam gradient -->
    <linearGradient id="ptm-steam1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f5cba0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5cba0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ptm-steam2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f5cba0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f5cba0" stop-opacity="0"/>
    </linearGradient>
    <!-- Plate rim gradient -->
    <linearGradient id="ptm-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5040"/>
      <stop offset="50%" stop-color="#4a2e1e"/>
      <stop offset="100%" stop-color="#3a201a"/>
    </linearGradient>
    <!-- Warm ambient glow -->
    <radialGradient id="ptm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b3a10" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b3a10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#ptm-bg)"/>

  <!-- Ambient warm glow under dish -->
  <ellipse cx="400" cy="420" rx="280" ry="100" fill="url(#ptm-glow)"/>

  <!-- Table surface subtle gradient -->
  <ellipse cx="400" cy="520" rx="340" ry="60" fill="#2a1005" opacity="0.7"/>

  <!-- Bowl outer shadow -->
  <ellipse cx="404" cy="408" rx="216" ry="64" fill="#150800" opacity="0.6"/>

  <!-- Bowl outer rim -->
  <ellipse cx="400" cy="400" rx="215" ry="62" fill="url(#ptm-rim)"/>

  <!-- Bowl inner -->
  <ellipse cx="400" cy="396" rx="196" ry="54" fill="url(#ptm-bowl)"/>

  <!-- Sauce fill in bowl -->
  <ellipse cx="400" cy="392" rx="183" ry="48" fill="url(#ptm-sauce)"/>

  <!-- Sauce surface shimmer -->
  <ellipse cx="380" cy="378" rx="120" ry="32" fill="url(#ptm-shimmer)"/>

  <!-- Sauce texture - subtle swirls -->
  <path d="M280 385 Q310 370 340 382 Q370 394 400 383 Q430 372 460 383 Q490 394 510 382" fill="none" stroke="#d95010" stroke-width="2.5" opacity="0.35"/>
  <path d="M295 396 Q330 382 365 393 Q395 404 430 393 Q460 382 490 394" fill="none" stroke="#e06020" stroke-width="2" opacity="0.25"/>

  <!-- Chicken piece 1 - left -->
  <ellipse cx="320" cy="375" rx="48" ry="30" fill="#7a2509" opacity="0.5"/>
  <path d="M276 362 Q285 344 320 338 Q358 332 366 356 Q374 376 358 388 Q340 400 308 392 Q278 382 276 362Z" fill="url(#ptm-chicken1)"/>
  <!-- Char marks on chicken 1 -->
  <path d="M295 355 Q302 348 312 355" fill="none" stroke="#8b5a25" stroke-width="2.5" opacity="0.5"/>
  <path d="M325 345 Q335 340 342 348" fill="none" stroke="#8b5a25" stroke-width="2.5" opacity="0.4"/>
  <!-- Sauce coating on chicken 1 -->
  <path d="M276 365 Q280 374 292 382 Q308 392 330 390 Q350 388 362 378" fill="none" stroke="#c0441a" stroke-width="3" opacity="0.6"/>

  <!-- Chicken piece 2 - center-right -->
  <ellipse cx="430" cy="368" rx="50" ry="28" fill="#7a2509" opacity="0.4"/>
  <path d="M384 355 Q392 336 430 330 Q470 324 478 350 Q484 370 466 382 Q448 394 416 388 Q386 378 384 355Z" fill="url(#ptm-chicken2)"/>
  <!-- Char marks on chicken 2 -->
  <path d="M400 348 Q410 341 422 348" fill="none" stroke="#8b5a25" stroke-width="2.5" opacity="0.5"/>
  <path d="M438 340 Q448 334 456 342" fill="none" stroke="#8b5a25" stroke-width="2.5" opacity="0.4"/>
  <!-- Sauce coating on chicken 2 -->
  <path d="M386 360 Q390 372 404 380 Q422 390 446 386 Q464 382 475 372" fill="none" stroke="#c0441a" stroke-width="3" opacity="0.55"/>

  <!-- Chicken piece 3 - smaller, background -->
  <ellipse cx="388" cy="405" rx="36" ry="20" fill="#7a2509" opacity="0.35"/>
  <path d="M355 396 Q362 382 388 378 Q418 374 424 392 Q428 406 412 414 Q394 422 372 414 Q356 406 355 396Z" fill="url(#ptm-chicken3)"/>

  <!-- Almond slivers in sauce -->
  <ellipse cx="358" cy="402" rx="10" ry="4" fill="#e8d4a0" opacity="0.8" transform="rotate(-20 358 402)"/>
  <ellipse cx="448" cy="396" rx="9" ry="3.5" fill="#e8d4a0" opacity="0.75" transform="rotate(15 448 396)"/>
  <ellipse cx="295" cy="394" rx="8" ry="3" fill="#e8d4a0" opacity="0.7" transform="rotate(-10 295 394)"/>
  <ellipse cx="480" cy="406" rx="9" ry="3.5" fill="#e8d4a0" opacity="0.65" transform="rotate(25 480 406)"/>

  <!-- Fresh coriander leaves -->
  <!-- Coriander cluster 1 - center top of bowl -->
  <ellipse cx="396" cy="352" rx="12" ry="7" fill="#4a9040" transform="rotate(-30 396 352)"/>
  <ellipse cx="408" cy="348" rx="11" ry="6.5" fill="#5aaa4c" transform="rotate(10 408 348)"/>
  <ellipse cx="382" cy="356" rx="10" ry="6" fill="#3d8035" transform="rotate(-50 382 356)"/>
  <ellipse cx="400" cy="344" rx="9" ry="5.5" fill="#66bb55" transform="rotate(5 400 344)"/>
  <!-- Coriander stems -->
  <path d="M392 358 Q388 350 385 344" fill="none" stroke="#3d8035" stroke-width="1.5" opacity="0.8"/>
  <path d="M400 356 Q400 348 400 342" fill="none" stroke="#3d8035" stroke-width="1.5" opacity="0.8"/>
  <path d="M408 356 Q410 348 412 342" fill="none" stroke="#4a9040" stroke-width="1.5" opacity="0.7"/>

  <!-- Coriander cluster 2 - right side -->
  <ellipse cx="468" cy="365" rx="11" ry="6.5" fill="#4a9040" transform="rotate(20 468 365)"/>
  <ellipse cx="478" cy="360" rx="10" ry="6" fill="#5aaa4c" transform="rotate(-15 478 360)"/>
  <ellipse cx="460" cy="358" rx="9" ry="5.5" fill="#3d8035" transform="rotate(40 460 358)"/>
  <path d="M466 368 Q464 360 462 354" fill="none" stroke="#3d8035" stroke-width="1.5" opacity="0.75"/>
  <path d="M474 366 Q476 358 478 352" fill="none" stroke="#4a9040" stroke-width="1.5" opacity="0.7"/>

  <!-- Coriander cluster 3 - left accent -->
  <ellipse cx="318" cy="358" rx="10" ry="6" fill="#4a9040" transform="rotate(-20 318 358)"/>
  <ellipse cx="308" cy="354" rx="9" ry="5.5" fill="#5aaa4c" transform="rotate(25 308 354)"/>
  <path d="M314 362 Q312 354 310 348" fill="none" stroke="#3d8035" stroke-width="1.5" opacity="0.75"/>

  <!-- Steam wisps -->
  <!-- Steam 1 -->
  <path d="M370 330 Q362 310 372 288 Q380 270 368 250" fill="none" stroke="url(#ptm-steam1)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <!-- Steam 2 -->
  <path d="M400 318 Q408 296 398 274 Q390 256 402 234" fill="none" stroke="url(#ptm-steam2)" stroke-width="7" stroke-linecap="round" opacity="0.4"/>
  <!-- Steam 3 -->
  <path d="M432 325 Q440 305 430 284 Q422 266 434 244" fill="none" stroke="url(#ptm-steam1)" stroke-width="6" stroke-linecap="round" opacity="0.35"/>

  <!-- Bowl rim highlight -->
  <path d="M185 396 Q220 340 400 334 Q580 328 615 396" fill="none" stroke="#7a5040" stroke-width="2" opacity="0.5"/>
  <path d="M190 398 Q230 344 400 338 Q570 332 610 398" fill="none" stroke="#9a6858" stroke-width="1" opacity="0.3"/>

  <!-- Subtle spice dots in sauce: dark spots -->
  <circle cx="310" cy="382" r="2.5" fill="#7a2509" opacity="0.6"/>
  <circle cx="350" cy="388" r="2" fill="#7a2509" opacity="0.5"/>
  <circle cx="440" cy="384" r="2.5" fill="#7a2509" opacity="0.55"/>
  <circle cx="475" cy="390" r="2" fill="#7a2509" opacity="0.5"/>
  <circle cx="500" cy="380" r="2" fill="#7a2509" opacity="0.45"/>

  <!-- Red pepper hint -->
  <circle cx="505" cy="372" r="5" fill="#d42020" opacity="0.7"/>
  <circle cx="280" cy="386" r="4" fill="#cc2010" opacity="0.6"/>

  <!-- Warm ambient rim glow on bowl -->
  <ellipse cx="400" cy="396" rx="195" ry="55" fill="none" stroke="#c0441a" stroke-width="1.5" opacity="0.2"/>
</svg>

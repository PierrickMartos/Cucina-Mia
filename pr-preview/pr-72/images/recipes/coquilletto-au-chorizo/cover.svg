<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Background radial gradient -->
    <radialGradient id="cac-bg" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#3d2010"/>
      <stop offset="60%" stop-color="#1e0d06"/>
      <stop offset="100%" stop-color="#0d0503"/>
    </radialGradient>
    <!-- Bowl gradient -->
    <radialGradient id="cac-bowl" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f5efe0"/>
      <stop offset="100%" stop-color="#c8b890"/>
    </radialGradient>
    <!-- Bowl inside gradient - pasta surface -->
    <radialGradient id="cac-inside" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8d595"/>
      <stop offset="50%" stop-color="#d4b860"/>
      <stop offset="100%" stop-color="#b89440"/>
    </radialGradient>
    <!-- Steam gradient -->
    <linearGradient id="cac-steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f0c870" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f0c870" stop-opacity="0"/>
    </linearGradient>
    <!-- Ambient warm light -->
    <radialGradient id="cac-light" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#c87820" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c87820" stop-opacity="0"/>
    </radialGradient>
    <!-- Parmesan dust gradient -->
    <radialGradient id="cac-parm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f0d8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f5f0d8" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate shadow -->
    <radialGradient id="cac-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#cac-bg)"/>

  <!-- Ambient warm glow -->
  <ellipse cx="400" cy="280" rx="380" ry="300" fill="url(#cac-light)"/>

  <!-- Table surface hint -->
  <ellipse cx="400" cy="530" rx="380" ry="60" fill="#1a0a04" opacity="0.8"/>

  <!-- Plate shadow on table -->
  <ellipse cx="400" cy="510" rx="240" ry="30" fill="url(#cac-shadow)"/>

  <!-- Wide bowl - outer rim -->
  <ellipse cx="400" cy="400" rx="240" ry="50" fill="#b8a070"/>
  <!-- Bowl body -->
  <path d="M 160 400 Q 160 520 400 530 Q 640 520 640 400 Z" fill="url(#cac-bowl)"/>
  <!-- Bowl rim highlight -->
  <ellipse cx="400" cy="400" rx="240" ry="50" fill="none" stroke="#e8d8a8" stroke-width="3" opacity="0.6"/>
  <!-- Bowl inner top ellipse (pasta surface) -->
  <ellipse cx="400" cy="400" rx="220" ry="42" fill="url(#cac-inside)"/>

  <!-- Pasta base texture - coquillettes (shell shapes) -->
  <!-- Group of small shell/tube shapes scattered across bowl surface -->

  <!-- Bottom layer pasta shells - muted golden -->
  <g opacity="0.85">
    <!-- Row 1 far back -->
    <ellipse cx="310" cy="390" rx="9" ry="5" fill="#c8a840" transform="rotate(-15,310,390)"/>
    <ellipse cx="340" cy="385" rx="8" ry="4" fill="#d4b450" transform="rotate(10,340,385)"/>
    <ellipse cx="370" cy="382" rx="9" ry="5" fill="#c09830" transform="rotate(-5,370,382)"/>
    <ellipse cx="400" cy="381" rx="10" ry="5" fill="#ccaa40" transform="rotate(20,400,381)"/>
    <ellipse cx="430" cy="383" rx="9" ry="4" fill="#c8a038" transform="rotate(-10,430,383)"/>
    <ellipse cx="458" cy="387" rx="8" ry="5" fill="#d0ac48" transform="rotate(15,458,387)"/>
    <ellipse cx="486" cy="391" rx="9" ry="5" fill="#c49830" transform="rotate(-20,486,391)"/>

    <!-- Row 2 mid -->
    <ellipse cx="295" cy="402" rx="10" ry="5" fill="#d4b450" transform="rotate(8,295,402)"/>
    <ellipse cx="325" cy="397" rx="9" ry="5" fill="#c8a038" transform="rotate(-12,325,397)"/>
    <ellipse cx="355" cy="395" rx="10" ry="5" fill="#ccaa42" transform="rotate(18,355,395)"/>
    <ellipse cx="385" cy="393" rx="9" ry="4" fill="#d0b045" transform="rotate(-8,385,393)"/>
    <ellipse cx="415" cy="393" rx="10" ry="5" fill="#c8a238" transform="rotate(12,415,393)"/>
    <ellipse cx="445" cy="396" rx="9" ry="5" fill="#d4b050" transform="rotate(-18,445,396)"/>
    <ellipse cx="475" cy="400" rx="10" ry="5" fill="#ccaa40" transform="rotate(6,475,400)"/>
    <ellipse cx="505" cy="404" rx="9" ry="5" fill="#c89838" transform="rotate(-15,505,404)"/>

    <!-- Row 3 front -->
    <ellipse cx="280" cy="414" rx="10" ry="5" fill="#c8a238" transform="rotate(-10,280,414)"/>
    <ellipse cx="312" cy="409" rx="9" ry="5" fill="#d4b450" transform="rotate(14,312,409)"/>
    <ellipse cx="345" cy="407" rx="10" ry="5" fill="#ccaa40" transform="rotate(-6,345,407)"/>
    <ellipse cx="378" cy="405" rx="9" ry="4" fill="#c8a038" transform="rotate(20,378,405)"/>
    <ellipse cx="410" cy="405" rx="10" ry="5" fill="#d0ae45" transform="rotate(-16,410,405)"/>
    <ellipse cx="443" cy="407" rx="9" ry="5" fill="#c49830" transform="rotate(8,443,407)"/>
    <ellipse cx="475" cy="410" rx="10" ry="5" fill="#ccaa40" transform="rotate(-12,475,410)"/>
    <ellipse cx="506" cy="415" rx="9" ry="5" fill="#d4b450" transform="rotate(18,506,415)"/>

    <!-- Row 4 foreground -->
    <ellipse cx="300" cy="425" rx="10" ry="5" fill="#d0ac45" transform="rotate(10,300,425)"/>
    <ellipse cx="333" cy="420" rx="9" ry="5" fill="#c8a038" transform="rotate(-14,333,420)"/>
    <ellipse cx="366" cy="418" rx="10" ry="5" fill="#ccaa40" transform="rotate(6,366,418)"/>
    <ellipse cx="399" cy="417" rx="9" ry="4" fill="#d4b450" transform="rotate(-20,399,417)"/>
    <ellipse cx="432" cy="418" rx="10" ry="5" fill="#c8a238" transform="rotate(16,432,418)"/>
    <ellipse cx="464" cy="420" rx="9" ry="5" fill="#d0ac45" transform="rotate(-8,464,420)"/>
    <ellipse cx="495" cy="424" rx="10" ry="5" fill="#ccaa40" transform="rotate(12,495,424)"/>
  </g>

  <!-- Chorizo pieces - deep red cubes scattered across pasta -->
  <!-- Large chorizo pieces -->
  <rect x="318" y="389" width="16" height="14" rx="3" fill="#c03020" transform="rotate(-8,326,396)"/>
  <rect x="318" y="389" width="16" height="14" rx="3" fill="none" stroke="#a02010" stroke-width="1" transform="rotate(-8,326,396)" opacity="0.7"/>

  <rect x="365" y="394" width="18" height="15" rx="3" fill="#b82818" transform="rotate(12,374,401)"/>
  <rect x="365" y="394" width="18" height="15" rx="3" fill="none" stroke="#901a10" stroke-width="1" transform="rotate(12,374,401)" opacity="0.7"/>

  <rect x="420" y="391" width="16" height="14" rx="3" fill="#c03020" transform="rotate(-15,428,398)"/>
  <rect x="420" y="391" width="16" height="14" rx="3" fill="none" stroke="#a02010" stroke-width="1" transform="rotate(-15,428,398)" opacity="0.7"/>

  <rect x="460" y="397" width="17" height="14" rx="3" fill="#b82818" transform="rotate(6,468,404)"/>

  <rect x="340" y="407" width="16" height="13" rx="3" fill="#c83025" transform="rotate(18,348,413)"/>

  <rect x="395" y="405" width="18" height="15" rx="3" fill="#bf2a1a" transform="rotate(-10,404,412)"/>
  <rect x="395" y="405" width="18" height="15" rx="3" fill="none" stroke="#901a10" stroke-width="1" transform="rotate(-10,404,412)" opacity="0.7"/>

  <rect x="443" y="408" width="16" height="13" rx="3" fill="#c03020" transform="rotate(14,451,414)"/>

  <rect x="308" y="413" width="15" height="13" rx="3" fill="#b82818" transform="rotate(-5,315,419)"/>

  <!-- Smaller chorizo bits -->
  <circle cx="350" cy="396" r="6" fill="#c83025"/>
  <circle cx="412" cy="399" r="5" fill="#bf2a1a"/>
  <circle cx="478" cy="407" r="6" fill="#c03020"/>
  <circle cx="323" cy="420" r="5" fill="#b82818"/>
  <circle cx="468" cy="416" r="6" fill="#c83025"/>
  <circle cx="385" cy="418" r="5" fill="#c03020"/>

  <!-- Oil/fat shimmer from chorizo -->
  <ellipse cx="330" cy="395" rx="15" ry="8" fill="#e85030" opacity="0.15" transform="rotate(-8,330,395)"/>
  <ellipse cx="404" cy="410" rx="18" ry="9" fill="#e85030" opacity="0.12" transform="rotate(5,404,410)"/>

  <!-- Tomato pieces - bright red irregular shapes -->
  <path d="M 290 408 Q 298 403 305 408 Q 302 416 294 415 Z" fill="#e04030" opacity="0.9"/>
  <path d="M 290 408 Q 298 403 305 408 Q 302 416 294 415 Z" fill="none" stroke="#c03020" stroke-width="1" opacity="0.5"/>

  <path d="M 488 400 Q 496 395 503 401 Q 500 409 492 408 Z" fill="#d83828" opacity="0.9"/>

  <path d="M 356 415 Q 364 410 371 416 Q 368 424 360 423 Z" fill="#e04030" opacity="0.9"/>

  <path d="M 430 416 Q 437 411 444 417 Q 441 424 433 423 Z" fill="#d83828" opacity="0.85"/>

  <!-- Tomato seeds detail -->
  <ellipse cx="298" cy="410" rx="3" ry="2" fill="#f06050" opacity="0.7"/>
  <ellipse cx="363" cy="417" rx="3" ry="2" fill="#f06050" opacity="0.7"/>

  <!-- Parmesan dusting - white/cream specks -->
  <g opacity="0.8">
    <circle cx="322" cy="392" r="3" fill="#f5f0d8"/>
    <circle cx="348" cy="388" r="2" fill="#f5eed5"/>
    <circle cx="376" cy="386" r="3" fill="#f5f0d8"/>
    <circle cx="408" cy="385" r="2" fill="#f0ebd0"/>
    <circle cx="438" cy="387" r="3" fill="#f5f0d8"/>
    <circle cx="466" cy="392" r="2" fill="#f5eed5"/>
    <circle cx="360" cy="400" r="2" fill="#f5f0d8"/>
    <circle cx="420" cy="402" r="3" fill="#f0ebd0"/>
    <circle cx="390" cy="395" r="2" fill="#f5f0d8"/>
    <circle cx="450" cy="404" r="2" fill="#f5eed5"/>
    <circle cx="310" cy="405" r="3" fill="#f5f0d8"/>
    <circle cx="500" cy="410" r="2" fill="#f5eed5"/>
    <circle cx="340" cy="413" r="3" fill="#f5f0d8"/>
    <circle cx="460" cy="414" r="2" fill="#f0ebd0"/>
    <circle cx="400" cy="420" r="3" fill="#f5f0d8"/>
    <circle cx="330" cy="398" r="2" fill="#f5eed5"/>
    <circle cx="480" cy="396" r="2" fill="#f5f0d8"/>
    <circle cx="415" cy="412" r="2" fill="#f0ebd0"/>
    <circle cx="370" cy="410" r="2" fill="#f5f0d8"/>
  </g>

  <!-- Parmesan larger flakes -->
  <ellipse cx="355" cy="403" rx="6" ry="3" fill="#f5f0d8" opacity="0.7" transform="rotate(-20,355,403)"/>
  <ellipse cx="425" cy="406" rx="5" ry="3" fill="#f5f0d8" opacity="0.65" transform="rotate(15,425,406)"/>
  <ellipse cx="395" cy="413" rx="6" ry="3" fill="#f0ebd0" opacity="0.7" transform="rotate(-5,395,413)"/>
  <ellipse cx="340" cy="393" rx="5" ry="2" fill="#f5f0d8" opacity="0.6" transform="rotate(25,340,393)"/>
  <ellipse cx="460" cy="399" rx="6" ry="3" fill="#f5eed5" opacity="0.65" transform="rotate(-15,460,399)"/>

  <!-- Steam wisps rising from bowl -->
  <g opacity="0.35">
    <path d="M 360 395 Q 355 370 362 350 Q 368 330 360 310" fill="none" stroke="url(#cac-steam)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 400 390 Q 396 360 403 335 Q 409 310 400 285" fill="none" stroke="url(#cac-steam)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 440 394 Q 435 368 443 345 Q 449 322 440 298" fill="none" stroke="url(#cac-steam)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bowl outer lower shine -->
  <path d="M 180 420 Q 200 500 400 510 Q 600 500 620 420" fill="none" stroke="#e8d8a8" stroke-width="2" opacity="0.3"/>

  <!-- Warm counter-light around bowl -->
  <ellipse cx="400" cy="440" rx="260" ry="70" fill="none" stroke="#c87820" stroke-width="20" opacity="0.08"/>

  <!-- Subtle specular highlight on bowl rim -->
  <path d="M 220 395 Q 260 375 310 372" fill="none" stroke="#fffbe8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>

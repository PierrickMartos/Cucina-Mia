<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="lcgm-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3d1f08"/>
      <stop offset="60%" stop-color="#2a1205"/>
      <stop offset="100%" stop-color="#160a02"/>
    </radialGradient>
    <radialGradient id="lcgm-bowl-base" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#5a3520"/>
      <stop offset="70%" stop-color="#3d2210"/>
      <stop offset="100%" stop-color="#2a1608"/>
    </radialGradient>
    <radialGradient id="lcgm-lentils-surface" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e89020"/>
      <stop offset="40%" stop-color="#d4780a"/>
      <stop offset="80%" stop-color="#b85e06"/>
      <stop offset="100%" stop-color="#9a4d04"/>
    </radialGradient>
    <radialGradient id="lcgm-cream-swirl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f0e8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8dcc8" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="lcgm-steam-blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="lcgm-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lcgm-bowl-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5030"/>
      <stop offset="100%" stop-color="#4a2c12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#lcgm-bg)"/>

  <!-- Warm ambient glow -->
  <ellipse cx="400" cy="340" rx="320" ry="240" fill="#d4780a" opacity="0.08"/>
  <ellipse cx="400" cy="340" rx="200" ry="160" fill="#e89020" opacity="0.06"/>

  <!-- Bowl shadow on table -->
  <ellipse cx="400" cy="530" rx="210" ry="28" fill="#0a0402" opacity="0.7"/>

  <!-- Bowl outer body -->
  <ellipse cx="400" cy="430" rx="230" ry="50" fill="url(#lcgm-bowl-rim)"/>
  <path d="M 170 430 Q 175 530 400 545 Q 625 530 630 430 Z" fill="url(#lcgm-bowl-base)"/>

  <!-- Bowl inner rim shadow -->
  <ellipse cx="400" cy="430" rx="220" ry="44" fill="#2a1608" opacity="0.5"/>

  <!-- Lentil surface inside bowl -->
  <ellipse cx="400" cy="425" rx="200" ry="38" fill="url(#lcgm-lentils-surface)"/>

  <!-- Lentil texture - individual lentil dots -->
  <g opacity="0.8">
    <!-- Row 1 -->
    <ellipse cx="330" cy="420" rx="6" ry="4" fill="#e8c050"/>
    <ellipse cx="355" cy="418" rx="5" ry="3.5" fill="#d4780a"/>
    <ellipse cx="378" cy="422" rx="6" ry="4" fill="#e89020"/>
    <ellipse cx="403" cy="417" rx="5" ry="3.5" fill="#e8c050"/>
    <ellipse cx="427" cy="421" rx="6" ry="4" fill="#d4780a"/>
    <ellipse cx="452" cy="419" rx="5" ry="3.5" fill="#e89020"/>
    <ellipse cx="475" cy="423" rx="6" ry="4" fill="#e8c050"/>
    <!-- Row 2 -->
    <ellipse cx="315" cy="430" rx="5" ry="3" fill="#e89020"/>
    <ellipse cx="342" cy="428" rx="6" ry="4" fill="#e8c050"/>
    <ellipse cx="368" cy="432" rx="5" ry="3.5" fill="#d4780a"/>
    <ellipse cx="394" cy="427" rx="6" ry="4" fill="#e89020"/>
    <ellipse cx="419" cy="431" rx="5" ry="3" fill="#e8c050"/>
    <ellipse cx="445" cy="429" rx="6" ry="4" fill="#d4780a"/>
    <ellipse cx="470" cy="433" rx="5" ry="3.5" fill="#e89020"/>
    <ellipse cx="494" cy="428" rx="4" ry="3" fill="#e8c050"/>
    <!-- Row 3 -->
    <ellipse cx="350" cy="437" rx="5" ry="3" fill="#d4780a"/>
    <ellipse cx="376" cy="440" rx="6" ry="3.5" fill="#e8c050"/>
    <ellipse cx="402" cy="436" rx="5" ry="3" fill="#e89020"/>
    <ellipse cx="428" cy="439" rx="6" ry="3.5" fill="#d4780a"/>
    <ellipse cx="454" cy="437" rx="5" ry="3" fill="#e8c050"/>
  </g>

  <!-- Shredded chicken pieces -->
  <g opacity="0.9">
    <path d="M 340 415 Q 360 410 375 418 Q 360 422 340 420 Z" fill="#f0d8a0" opacity="0.85"/>
    <path d="M 380 408 Q 400 404 415 412 Q 400 416 383 413 Z" fill="#eed8a0" opacity="0.85"/>
    <path d="M 425 413 Q 445 409 458 417 Q 445 421 428 418 Z" fill="#f0d8a0" opacity="0.85"/>
    <path d="M 355 428 Q 370 424 382 430 Q 370 434 357 431 Z" fill="#eed8a0" opacity="0.8"/>
    <path d="M 410 425 Q 428 421 440 428 Q 428 432 412 429 Z" fill="#f0d8a0" opacity="0.8"/>
    <path d="M 365 438 Q 380 434 390 440 Q 380 444 367 441 Z" fill="#eed8a0" opacity="0.75"/>
  </g>

  <!-- Green pepper dices -->
  <g>
    <rect x="358" y="412" width="9" height="8" rx="2" fill="#4a8020" opacity="0.9"/>
    <rect x="392" y="420" width="8" height="7" rx="2" fill="#5a9028" opacity="0.9"/>
    <rect x="438" y="415" width="9" height="8" rx="2" fill="#4a8020" opacity="0.9"/>
    <rect x="320" y="425" width="7" height="7" rx="2" fill="#5a9028" opacity="0.85"/>
    <rect x="463" y="421" width="8" height="7" rx="2" fill="#4a8020" opacity="0.85"/>
    <rect x="407" y="432" width="7" height="6" rx="2" fill="#5a9028" opacity="0.8"/>
    <rect x="375" y="435" width="8" height="7" rx="2" fill="#4a8020" opacity="0.8"/>
  </g>

  <!-- Coconut cream swirl -->
  <path d="M 380 418 Q 400 408 425 415 Q 445 422 430 432 Q 415 440 395 435 Q 375 428 380 418 Z"
        fill="url(#lcgm-cream-swirl)" opacity="0.75"/>
  <path d="M 385 420 Q 405 413 422 419 Q 435 425 425 432 Q 412 437 398 433 Q 382 426 385 420 Z"
        fill="#f5f0e8" opacity="0.4"/>

  <!-- Bowl rim highlight -->
  <ellipse cx="400" cy="430" rx="220" ry="44" fill="none" stroke="#8a6040" stroke-width="3" opacity="0.6"/>
  <ellipse cx="400" cy="429" rx="219" ry="43" fill="none" stroke="#c09070" stroke-width="1" opacity="0.3"/>

  <!-- Steam wisps -->
  <g filter="url(#lcgm-steam-blur)" opacity="0.45">
    <path d="M 340 405 Q 330 375 340 355 Q 350 335 340 310" stroke="#f5f0e8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 390 400 Q 380 370 392 345 Q 404 320 394 295" stroke="#f5f0e8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 445 403 Q 435 373 447 350 Q 459 325 450 298" stroke="#f5f0e8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 500 408 Q 492 382 503 360 Q 514 340 506 315" stroke="#f5f0e8" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Decorative spice dusting on rim -->
  <g opacity="0.6">
    <ellipse cx="250" cy="432" rx="4" ry="3" fill="#c86010" opacity="0.7"/>
    <ellipse cx="270" cy="436" rx="3" ry="2" fill="#d47020" opacity="0.6"/>
    <ellipse cx="530" cy="433" rx="4" ry="3" fill="#c86010" opacity="0.7"/>
    <ellipse cx="550" cy="437" rx="3" ry="2" fill="#d47020" opacity="0.6"/>
  </g>

  <!-- Warm light reflection on bowl surface -->
  <ellipse cx="340" cy="435" rx="30" ry="8" fill="#f0a830" opacity="0.12"/>
  <ellipse cx="460" cy="437" rx="25" ry="7" fill="#f0a830" opacity="0.10"/>

  <!-- Subtle spice particles floating -->
  <g opacity="0.5">
    <circle cx="300" cy="370" r="2" fill="#d4780a"/>
    <circle cx="490" cy="360" r="1.5" fill="#e89020"/>
    <circle cx="520" cy="390" r="2" fill="#d4780a"/>
    <circle cx="280" cy="400" r="1.5" fill="#c86010"/>
  </g>
</svg>

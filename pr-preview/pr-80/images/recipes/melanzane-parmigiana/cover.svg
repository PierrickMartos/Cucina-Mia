<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="epbg" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#2e2822"/><stop offset="100%" stop-color="#1a1510"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#epbg)"/>
  <ellipse cx="405" cy="420" rx="200" ry="38" fill="#0d0a07" opacity="0.45"/>
  <!-- Ceramic baking dish -->
  <rect x="200" y="210" width="400" height="190" rx="14" fill="#d4580a" stroke="#b04808" stroke-width="2"/>
  <!-- Top cheese crust -->
  <rect x="210" y="215" width="380" height="50" rx="8" fill="#d8a020"/>
  <g fill="#c09018" opacity="0.5">
    <ellipse cx="270" cy="235" rx="20" ry="10"/><ellipse cx="350" cy="230" rx="25" ry="12"/>
    <ellipse cx="440" cy="238" rx="18" ry="10"/><ellipse cx="520" cy="232" rx="22" ry="11"/>
  </g>
  <!-- Cheese bubbles -->
  <g fill="#e8b828" opacity="0.35">
    <circle cx="290" cy="225" r="4"/><circle cx="370" cy="222" r="5"/>
    <circle cx="460" cy="228" r="3.5"/><circle cx="530" cy="225" r="4"/>
  </g>
  <!-- Eggplant layer (dark purple) -->
  <rect x="210" y="262" width="380" height="30" rx="2" fill="#4a2048"/>
  <g fill="#3a1838" opacity="0.4">
    <ellipse cx="280" cy="276" rx="25" ry="6"/><ellipse cx="400" cy="278" rx="28" ry="7"/>
    <ellipse cx="520" cy="275" rx="22" ry="6"/>
  </g>
  <!-- Sauce layer -->
  <rect x="210" y="290" width="380" height="25" rx="2" fill="#a83020"/>
  <!-- Mozzarella layer -->
  <rect x="210" y="313" width="380" height="18" rx="2" fill="#f0e8d8"/>
  <g fill="#e8dcc8" opacity="0.5">
    <ellipse cx="300" cy="322" rx="20" ry="4"/><ellipse cx="440" cy="320" rx="22" ry="5"/>
  </g>
  <!-- More eggplant -->
  <rect x="210" y="329" width="380" height="28" rx="2" fill="#4a2048"/>
  <!-- Bottom sauce -->
  <rect x="210" y="355" width="380" height="22" rx="2" fill="#a83020"/>
  <!-- Dish bottom -->
  <rect x="210" y="375" width="380" height="18" rx="6" fill="#c04a08" opacity="0.6"/>
  <!-- Basil garnish on top -->
  <g transform="translate(400, 218) rotate(-10)"><path d="M0,0 Q-10,-16 0,-26 Q10,-16 0,0Z" fill="#2d7a2d"/></g>
  <g transform="translate(412, 220) rotate(20)"><path d="M0,0 Q-8,-13 0,-22 Q8,-13 0,0Z" fill="#35882e"/></g>
  <!-- Steam -->
  <g stroke="#f5f0e0" stroke-width="1.5" fill="none" opacity="0.1">
    <path d="M320,205 Q315,185 325,165 Q335,145 325,125"/>
    <path d="M420,200 Q415,180 425,160 Q435,140 425,120"/>
  </g>
</svg>

    <ellipse cx="300" cy="326" rx="4" ry="1.4" transform="rotate(18 300 326)"/>
    <ellipse cx="384" cy="330" rx="3.5" ry="1.3" transform="rotate(-12 384 330)"/>
    <ellipse cx="488" cy="304" rx="3.5" ry="1.3" transform="rotate(30 488 304)"/>

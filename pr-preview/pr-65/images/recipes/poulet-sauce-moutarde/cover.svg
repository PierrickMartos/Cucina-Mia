  <ellipse cx="400" cy="336" rx="200" ry="56" fill="#1e1b18"/>
  <ellipse cx="400" cy="336" rx="172" ry="47" fill="#262320"/>
  <!-- Rice mound, right side -->
  <ellipse cx="492" cy="322" rx="72" ry="34" fill="url(#psmrice)" opacity="0.95"/>
  <g fill="#fffdf6" opacity="0.5">

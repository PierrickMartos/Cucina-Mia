    <circle cx="336" cy="312" r="2.4"/><circle cx="264" cy="322" r="2"/>
    <circle cx="358" cy="322" r="2.2"/><circle cx="306" cy="332" r="2.4"/>
    <circle cx="386" cy="306" r="2"/><circle cx="276" cy="292" r="2.2"/>
    <circle cx="348" cy="298" r="2"/><circle cx="322" cy="344" r="2.2"/>
    <circle cx="252" cy="310" r="1.8"/><circle cx="370" cy="336" r="2"/>
    <circle cx="398" cy="322" r="2.2"/><circle cx="298" cy="316" r="2"/>
  </g>

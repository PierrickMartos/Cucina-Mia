<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="psmbg" cx="50%" cy="38%" r="72%"><stop offset="0%" stop-color="#332a20"/><stop offset="100%" stop-color="#1a1510"/></radialGradient>
    <radialGradient id="psmplate" cx="48%" cy="46%" r="52%"><stop offset="0%" stop-color="#2d2a26"/><stop offset="78%" stop-color="#1d1a17"/><stop offset="100%" stop-color="#111010"/></radialGradient>
    <radialGradient id="psmsauce" cx="44%" cy="38%" r="46%"><stop offset="0%" stop-color="#f2dfa4"/><stop offset="70%" stop-color="#e0c477"/><stop offset="100%" stop-color="#c6a552"/></radialGradient>
    <linearGradient id="psmchick" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f0d9ac"/><stop offset="60%" stop-color="#d9b478"/><stop offset="100%" stop-color="#b98d4e"/></linearGradient>
    <linearGradient id="psmshroom" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#8a6a48"/><stop offset="100%" stop-color="#5a4128"/></linearGradient>
    <radialGradient id="psmrice" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#f6f1e2"/><stop offset="100%" stop-color="#dcd3bd"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#psmbg)"/>
  <ellipse cx="405" cy="352" rx="230" ry="72" fill="#0d0a07" opacity="0.5"/>
  <!-- Plate -->

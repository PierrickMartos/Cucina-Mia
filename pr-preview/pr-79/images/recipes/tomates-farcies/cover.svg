<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="tf-bg" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#3a1a08"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </radialGradient>
    <!-- Dish gradient -->
    <linearGradient id="tf-dish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#a0846a"/>
    </linearGradient>
    <!-- Dish shadow -->
    <radialGradient id="tf-dish-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </radialGradient>
    <!-- Tomato left gradient -->
    <radialGradient id="tf-tom1" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#f04020"/>
      <stop offset="50%" stop-color="#cc2200"/>
      <stop offset="100%" stop-color="#8a1500"/>
    </radialGradient>
    <!-- Tomato center gradient -->
    <radialGradient id="tf-tom2" cx="40%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#f24525"/>
      <stop offset="50%" stop-color="#e03010"/>
      <stop offset="100%" stop-color="#901800"/>
    </radialGradient>
    <!-- Tomato right gradient -->
    <radialGradient id="tf-tom3" cx="42%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f03a18"/>
      <stop offset="50%" stop-color="#c82000"/>
      <stop offset="100%" stop-color="#871400"/>
    </radialGradient>
    <!-- Chapeau (lid) gradient -->
    <radialGradient id="tf-lid1" cx="40%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e03820"/>
      <stop offset="60%" stop-color="#b01c00"/>
      <stop offset="100%" stop-color="#7a1200"/>
    </radialGradient>
    <radialGradient id="tf-lid2" cx="40%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e83a22"/>
      <stop offset="60%" stop-color="#b82000"/>
      <stop offset="100%" stop-color="#801500"/>
    </radialGradient>
    <!-- Filling gradient -->
    <radialGradient id="tf-fill1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#dfc070"/>
      <stop offset="60%" stop-color="#c8a05a"/>
      <stop offset="100%" stop-color="#a07840"/>
    </radialGradient>
    <radialGradient id="tf-fill2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e0c472"/>
      <stop offset="60%" stop-color="#caa85c"/>
      <stop offset="100%" stop-color="#a47c42"/>
    </radialGradient>
    <!-- Ambient warm light -->
    <radialGradient id="tf-light" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(255,140,60,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,140,60,0)"/>
    </radialGradient>
    <!-- Drop shadow filter -->
    <filter id="tf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
    <filter id="tf-shadow-sm" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="tf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#tf-bg)"/>

  <!-- Ambient warm glow -->
  <ellipse cx="400" cy="320" rx="360" ry="240" fill="url(#tf-light)"/>

  <!-- Baking dish (ceramic, oval) -->
  <!-- Dish body -->
  <ellipse cx="400" cy="420" rx="280" ry="80" fill="#b89070" filter="url(#tf-shadow)"/>
  <ellipse cx="400" cy="395" rx="278" ry="68" fill="url(#tf-dish)"/>
  <!-- Dish rim highlight -->
  <ellipse cx="400" cy="395" rx="278" ry="68" fill="none" stroke="#e8d4b8" stroke-width="3" opacity="0.4"/>
  <!-- Dish interior -->
  <ellipse cx="400" cy="400" rx="255" ry="58" fill="#c09a72"/>
  <!-- Dish shadow overlay -->
  <ellipse cx="400" cy="400" rx="255" ry="58" fill="url(#tf-dish-shadow)"/>

  <!-- Dish handles -->
  <ellipse cx="132" cy="400" rx="28" ry="14" fill="#b89070"/>
  <ellipse cx="668" cy="400" rx="28" ry="14" fill="#b89070"/>
  <ellipse cx="132" cy="397" rx="26" ry="11" fill="#d4b896" opacity="0.7"/>
  <ellipse cx="668" cy="397" rx="26" ry="11" fill="#d4b896" opacity="0.7"/>

  <!-- ==== TOMATO LEFT ==== -->
  <!-- Body -->
  <ellipse cx="240" cy="380" rx="88" ry="75" fill="url(#tf-tom1)" filter="url(#tf-shadow-sm)"/>
  <!-- Caramelized bottom darkening -->
  <ellipse cx="240" cy="415" rx="70" ry="28" fill="rgba(80,10,0,0.35)"/>
  <!-- Shoulder crease lines -->
  <path d="M220,315 Q240,305 260,315" fill="none" stroke="rgba(80,10,0,0.4)" stroke-width="2"/>
  <path d="M200,325 Q240,312 280,325" fill="none" stroke="rgba(80,10,0,0.25)" stroke-width="1.5"/>
  <!-- Filling ring (open top where lid is offset) -->
  <ellipse cx="240" cy="325" rx="52" ry="18" fill="url(#tf-fill1)"/>
  <!-- Filling surface texture -->
  <ellipse cx="240" cy="325" rx="48" ry="15" fill="#d4aa60" opacity="0.5"/>
  <ellipse cx="232" cy="323" rx="22" ry="7" fill="#e8c878" opacity="0.4"/>
  <!-- Herb bits on filling -->
  <ellipse cx="228" cy="321" rx="4" ry="2" fill="#5a8040" opacity="0.8" transform="rotate(-20,228,321)"/>
  <ellipse cx="248" cy="326" rx="3" ry="1.5" fill="#4a7030" opacity="0.8" transform="rotate(10,248,326)"/>
  <ellipse cx="236" cy="330" rx="3.5" ry="1.5" fill="#6a9050" opacity="0.7" transform="rotate(-35,236,330)"/>
  <!-- Chapeau (lid) - slightly offset/tilted -->
  <ellipse cx="248" cy="302" rx="58" ry="22" fill="url(#tf-lid1)" filter="url(#tf-shadow-sm)" transform="rotate(-6,248,302)"/>
  <!-- Lid top highlight -->
  <ellipse cx="242" cy="296" rx="40" ry="12" fill="rgba(255,120,80,0.2)" transform="rotate(-6,242,296)"/>
  <!-- Stem nub on lid -->
  <ellipse cx="254" cy="288" rx="6" ry="4" fill="#3a6020"/>
  <rect x="252" y="280" width="4" height="10" rx="2" fill="#2a4a18"/>

  <!-- ==== TOMATO CENTER (slightly taller/prominent) ==== -->
  <ellipse cx="400" cy="360" rx="92" ry="80" fill="url(#tf-tom2)" filter="url(#tf-shadow-sm)"/>
  <!-- Caramelized bottom -->
  <ellipse cx="400" cy="398" rx="72" ry="28" fill="rgba(80,10,0,0.35)"/>
  <!-- Shoulder creases -->
  <path d="M378,292 Q400,281 422,292" fill="none" stroke="rgba(80,10,0,0.4)" stroke-width="2"/>
  <path d="M358,303 Q400,289 442,303" fill="none" stroke="rgba(80,10,0,0.25)" stroke-width="1.5"/>
  <!-- Filling ring -->
  <ellipse cx="400" cy="303" rx="55" ry="19" fill="url(#tf-fill2)"/>
  <ellipse cx="400" cy="303" rx="50" ry="16" fill="#d8b060" opacity="0.5"/>
  <ellipse cx="392" cy="301" rx="24" ry="7" fill="#ecd080" opacity="0.4"/>
  <!-- Herb bits -->
  <ellipse cx="386" cy="299" rx="4.5" ry="2" fill="#5a8040" opacity="0.85" transform="rotate(-15,386,299)"/>
  <ellipse cx="408" cy="305" rx="3.5" ry="1.5" fill="#4a7030" opacity="0.8" transform="rotate(15,408,305)"/>
  <ellipse cx="398" cy="310" rx="3" ry="1.5" fill="#6a9050" opacity="0.7" transform="rotate(-40,398,310)"/>
  <ellipse cx="416" cy="298" rx="3" ry="1.5" fill="#3a6020" opacity="0.7" transform="rotate(5,416,298)"/>
  <!-- Chapeau -->
  <ellipse cx="406" cy="280" rx="60" ry="22" fill="url(#tf-lid2)" filter="url(#tf-shadow-sm)" transform="rotate(4,406,280)"/>
  <ellipse cx="400" cy="274" rx="42" ry="12" fill="rgba(255,120,80,0.2)" transform="rotate(4,400,274)"/>
  <!-- Stem -->
  <ellipse cx="410" cy="265" rx="6" ry="4" fill="#3a6020"/>
  <rect x="408" y="257" width="4" height="10" rx="2" fill="#2a4a18"/>

  <!-- ==== TOMATO RIGHT ==== -->
  <ellipse cx="560" cy="378" rx="86" ry="73" fill="url(#tf-tom3)" filter="url(#tf-shadow-sm)"/>
  <!-- Caramelized bottom -->
  <ellipse cx="560" cy="412" rx="68" ry="26" fill="rgba(80,10,0,0.35)"/>
  <!-- Shoulder creases -->
  <path d="M540,318 Q560,307 580,318" fill="none" stroke="rgba(80,10,0,0.4)" stroke-width="2"/>
  <path d="M522,328 Q560,315 598,328" fill="none" stroke="rgba(80,10,0,0.25)" stroke-width="1.5"/>
  <!-- Filling ring -->
  <ellipse cx="560" cy="322" rx="51" ry="18" fill="url(#tf-fill1)"/>
  <ellipse cx="560" cy="322" rx="46" ry="14" fill="#d4aa60" opacity="0.5"/>
  <ellipse cx="553" cy="320" rx="21" ry="6" fill="#e8c878" opacity="0.4"/>
  <!-- Herb bits -->
  <ellipse cx="548" cy="318" rx="4" ry="2" fill="#5a8040" opacity="0.8" transform="rotate(-25,548,318)"/>
  <ellipse cx="568" cy="324" rx="3.5" ry="1.5" fill="#4a7030" opacity="0.8" transform="rotate(8,568,324)"/>
  <ellipse cx="556" cy="328" rx="3" ry="1.5" fill="#6a9050" opacity="0.7" transform="rotate(-30,556,328)"/>
  <!-- Chapeau - slightly ajar -->
  <ellipse cx="552" cy="300" rx="57" ry="21" fill="url(#tf-lid1)" filter="url(#tf-shadow-sm)" transform="rotate(-8,552,300)"/>
  <ellipse cx="546" cy="294" rx="39" ry="11" fill="rgba(255,120,80,0.2)" transform="rotate(-8,546,294)"/>
  <!-- Stem -->
  <ellipse cx="556" cy="286" rx="5.5" ry="3.5" fill="#3a6020"/>
  <rect x="554" y="278" width="4" height="9" rx="2" fill="#2a4a18"/>

  <!-- Herb sprigs scattered in dish -->
  <!-- Thyme sprig left area -->
  <path d="M155,390 Q170,375 185,380 Q200,368 215,372" fill="none" stroke="#5a8040" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="175" cy="376" rx="5" ry="2.5" fill="#4a7030" opacity="0.8" transform="rotate(-30,175,376)"/>
  <ellipse cx="191" cy="370" rx="4.5" ry="2" fill="#5a8040" opacity="0.7" transform="rotate(-20,191,370)"/>
  <ellipse cx="207" cy="373" rx="4" ry="2" fill="#4a7030" opacity="0.8" transform="rotate(-40,207,373)"/>

  <!-- Parsley sprig right area -->
  <path d="M585,375 Q600,362 618,367 Q632,355 648,360" fill="none" stroke="#4a7a30" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="602" cy="364" rx="6" ry="3" fill="#5a8a40" opacity="0.8" transform="rotate(15,602,364)"/>
  <ellipse cx="619" cy="358" rx="5.5" ry="2.5" fill="#4a7030" opacity="0.7" transform="rotate(25,619,358)"/>
  <ellipse cx="636" cy="362" rx="5" ry="2.5" fill="#5a8040" opacity="0.8" transform="rotate(10,636,362)"/>

  <!-- Small thyme sprigs near center tomato -->
  <path d="M310,405 Q320,398 330,400" fill="none" stroke="#5a8040" stroke-width="1.2" opacity="0.7"/>
  <ellipse cx="317" cy="399" rx="4" ry="2" fill="#4a7030" opacity="0.7" transform="rotate(-20,317,399)"/>
  <path d="M470,402 Q482,394 492,397" fill="none" stroke="#4a7a30" stroke-width="1.2" opacity="0.7"/>
  <ellipse cx="478" cy="396" rx="4" ry="2" fill="#5a8040" opacity="0.7" transform="rotate(15,478,396)"/>

  <!-- Warm highlight on dish rim -->
  <path d="M148,396 Q280,335 400,330 Q520,335 652,396" fill="none" stroke="rgba(255,200,140,0.15)" stroke-width="4"/>

  <!-- Subtle steam wisps -->
  <path d="M240,300 Q235,285 242,268 Q248,252 243,235" fill="none" stroke="rgba(255,220,180,0.12)" stroke-width="3" stroke-linecap="round"/>
  <path d="M400,276 Q394,260 401,243 Q407,226 402,210" fill="none" stroke="rgba(255,220,180,0.12)" stroke-width="3" stroke-linecap="round"/>
  <path d="M560,298 Q554,282 561,265 Q567,248 562,232" fill="none" stroke="rgba(255,220,180,0.12)" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle vignette -->
  <radialGradient id="tf-vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
  </radialGradient>
  <rect width="800" height="600" fill="url(#tf-vignette)"/>
</svg>

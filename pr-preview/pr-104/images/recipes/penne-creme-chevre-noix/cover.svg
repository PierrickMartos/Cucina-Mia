<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="pccn-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3a2a18"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </radialGradient>
    <!-- Bowl gradient -->
    <radialGradient id="pccn-bowl" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="70%" stop-color="#c8bfa8"/>
      <stop offset="100%" stop-color="#a89880"/>
    </radialGradient>
    <!-- Bowl inner shadow -->
    <radialGradient id="pccn-bowl-inner" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f5efe0" stop-opacity="0"/>
      <stop offset="80%" stop-color="#2a1a08" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2a1a08" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Sauce gradient -->
    <radialGradient id="pccn-sauce" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0ece0"/>
      <stop offset="60%" stop-color="#e8e0cc"/>
      <stop offset="100%" stop-color="#d4c8a8"/>
    </radialGradient>
    <!-- Walnut gradient -->
    <radialGradient id="pccn-walnut1" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d4a040"/>
      <stop offset="100%" stop-color="#8a5820"/>
    </radialGradient>
    <radialGradient id="pccn-walnut2" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#c89030"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </radialGradient>
    <radialGradient id="pccn-walnut3" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e0b050"/>
      <stop offset="100%" stop-color="#9a6828"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <linearGradient id="pccn-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8cfc0"/>
      <stop offset="50%" stop-color="#f0ebe0"/>
      <stop offset="100%" stop-color="#b8af9f"/>
    </linearGradient>
    <!-- Table surface -->
    <linearGradient id="pccn-table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1e0e"/>
      <stop offset="100%" stop-color="#180e06"/>
    </linearGradient>
    <!-- Warm light overlay -->
    <radialGradient id="pccn-light" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f0d890" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f0d890" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#pccn-bg)"/>
  <rect width="800" height="600" fill="url(#pccn-light)"/>

  <!-- Table surface hint -->
  <ellipse cx="400" cy="520" rx="380" ry="60" fill="url(#pccn-table)" opacity="0.6"/>

  <!-- Bowl shadow -->
  <ellipse cx="402" cy="508" rx="195" ry="28" fill="#0d0705" opacity="0.55"/>

  <!-- Bowl outer rim -->
  <ellipse cx="400" cy="480" rx="195" ry="30" fill="url(#pccn-rim)"/>

  <!-- Bowl body -->
  <path d="M205 340 Q210 490 400 500 Q590 490 595 340 Q540 320 400 318 Q260 320 205 340 Z" fill="url(#pccn-bowl)"/>

  <!-- Bowl inner shadow -->
  <path d="M205 340 Q210 490 400 500 Q590 490 595 340 Q540 320 400 318 Q260 320 205 340 Z" fill="url(#pccn-bowl-inner)"/>

  <!-- Sauce / cream base -->
  <ellipse cx="400" cy="358" rx="175" ry="55" fill="url(#pccn-sauce)" opacity="0.92"/>

  <!-- Creamy sauce pooling -->
  <ellipse cx="395" cy="380" rx="155" ry="42" fill="#ede8d8" opacity="0.6"/>

  <!-- Penne tubes - layer 1 (back) -->
  <!-- Tube helper: rounded rect tilted -->
  <g opacity="0.92">
    <!-- Penne group scattered -->
    <rect x="245" y="330" width="48" height="22" rx="10" ry="10" fill="#d4b870" transform="rotate(-18 269 341)"/>
    <rect x="315" y="315" width="50" height="21" rx="10" ry="10" fill="#c8aa60" transform="rotate(8 340 325)"/>
    <rect x="380" y="305" width="52" height="22" rx="10" ry="10" fill="#d4b870" transform="rotate(-5 406 316)"/>
    <rect x="450" y="310" width="49" height="22" rx="10" ry="10" fill="#c8a858" transform="rotate(14 474 321)"/>
    <rect x="508" y="328" width="50" height="21" rx="10" ry="10" fill="#d0b468" transform="rotate(-22 533 338)"/>

    <!-- Layer 2 (middle) -->
    <rect x="260" y="355" width="50" height="23" rx="11" ry="11" fill="#d8bc74" transform="rotate(12 285 366)"/>
    <rect x="330" y="342" width="52" height="22" rx="11" ry="11" fill="#ccaa62" transform="rotate(-10 356 353)"/>
    <rect x="400" y="338" width="50" height="23" rx="11" ry="11" fill="#d4b870" transform="rotate(6 425 349)"/>
    <rect x="468" y="344" width="51" height="22" rx="11" ry="11" fill="#c8a858" transform="rotate(-15 493 355)"/>
    <rect x="530" y="353" width="48" height="22" rx="11" ry="11" fill="#d0b468" transform="rotate(20 554 364)"/>

    <!-- Layer 3 (front) -->
    <rect x="278" y="382" width="51" height="23" rx="11" ry="11" fill="#d8bc74" transform="rotate(-8 303 393)"/>
    <rect x="350" y="370" width="50" height="24" rx="11" ry="11" fill="#d4b870" transform="rotate(16 375 382)"/>
    <rect x="418" y="368" width="52" height="23" rx="11" ry="11" fill="#cca862" transform="rotate(-12 444 379)"/>
    <rect x="488" y="374" width="49" height="23" rx="11" ry="11" fill="#d2b668" transform="rotate(9 512 385)"/>

    <!-- Layer 4 (foreground) -->
    <rect x="300" y="404" width="50" height="22" rx="11" ry="11" fill="#d6ba72" transform="rotate(5 325 415)"/>
    <rect x="368" y="398" width="52" height="23" rx="11" ry="11" fill="#d4b870" transform="rotate(-18 394 409)"/>
    <rect x="440" y="400" width="50" height="22" rx="11" ry="11" fill="#ccaa60" transform="rotate(12 465 411)"/>
  </g>

  <!-- Pasta tube holes (dark centers for depth) -->
  <g opacity="0.55">
    <ellipse cx="269" cy="338" rx="6" ry="9" fill="#7a5c28" transform="rotate(-18 269 338)"/>
    <ellipse cx="340" cy="323" rx="6" ry="9" fill="#7a5c28" transform="rotate(8 340 323)"/>
    <ellipse cx="406" cy="314" rx="7" ry="9" fill="#7a5c28" transform="rotate(-5 406 314)"/>
    <ellipse cx="474" cy="319" rx="6" ry="9" fill="#7a5c28" transform="rotate(14 474 319)"/>
    <ellipse cx="533" cy="336" rx="6" ry="9" fill="#7a5c28" transform="rotate(-22 533 336)"/>
    <ellipse cx="285" cy="364" rx="6" ry="9" fill="#7a5c28" transform="rotate(12 285 364)"/>
    <ellipse cx="356" cy="351" rx="7" ry="9" fill="#7a5c28" transform="rotate(-10 356 351)"/>
    <ellipse cx="425" cy="347" rx="6" ry="9" fill="#7a5c28" transform="rotate(6 425 347)"/>
    <ellipse cx="493" cy="353" rx="6" ry="9" fill="#7a5c28" transform="rotate(-15 493 353)"/>
    <ellipse cx="303" cy="391" rx="6" ry="9" fill="#7a5c28" transform="rotate(-8 303 391)"/>
    <ellipse cx="375" cy="380" rx="7" ry="9" fill="#7a5c28" transform="rotate(16 375 380)"/>
    <ellipse cx="444" cy="377" rx="6" ry="9" fill="#7a5c28" transform="rotate(-12 444 377)"/>
    <ellipse cx="325" cy="413" rx="6" ry="9" fill="#7a5c28" transform="rotate(5 325 413)"/>
    <ellipse cx="394" cy="407" rx="7" ry="9" fill="#7a5c28" transform="rotate(-18 394 407)"/>
    <ellipse cx="465" cy="409" rx="6" ry="9" fill="#7a5c28" transform="rotate(12 465 409)"/>
  </g>

  <!-- Leek slices (pale green rounds) -->
  <g opacity="0.88">
    <!-- Leek round 1 -->
    <ellipse cx="310" cy="360" rx="18" ry="13" fill="#8aaa68" transform="rotate(-15 310 360)"/>
    <ellipse cx="310" cy="360" rx="13" ry="9" fill="#a0c07a" transform="rotate(-15 310 360)"/>
    <ellipse cx="310" cy="360" rx="8" ry="5" fill="#b8d890" transform="rotate(-15 310 360)"/>
    <!-- Leek round 2 -->
    <ellipse cx="470" cy="355" rx="17" ry="12" fill="#7a9a60" transform="rotate(10 470 355)"/>
    <ellipse cx="470" cy="355" rx="12" ry="8" fill="#96b878" transform="rotate(10 470 355)"/>
    <ellipse cx="470" cy="355" rx="7" ry="4" fill="#aed090" transform="rotate(10 470 355)"/>
    <!-- Leek round 3 -->
    <ellipse cx="390" cy="415" rx="16" ry="11" fill="#8aaa68" transform="rotate(5 390 415)"/>
    <ellipse cx="390" cy="415" rx="11" ry="7" fill="#a2c07c" transform="rotate(5 390 415)"/>
    <ellipse cx="390" cy="415" rx="6" ry="4" fill="#b8d890" transform="rotate(5 390 415)"/>
    <!-- Leek strips -->
    <path d="M340 378 Q355 372 365 380 Q355 386 340 382 Z" fill="#90b070" opacity="0.8"/>
    <path d="M430 390 Q445 383 455 392 Q446 398 430 394 Z" fill="#88a868" opacity="0.8"/>
    <path d="M360 335 Q372 330 378 337 Q370 342 358 340 Z" fill="#96b878" opacity="0.75"/>
  </g>

  <!-- Goat cheese crumbles (white-cream irregular lumps) -->
  <g opacity="0.9">
    <ellipse cx="355" cy="340" rx="14" ry="9" fill="#f5f2ea" transform="rotate(20 355 340)"/>
    <ellipse cx="352" cy="338" rx="9" ry="6" fill="#fffdf8" transform="rotate(20 352 338)"/>
    <ellipse cx="448" cy="368" rx="13" ry="8" fill="#f2efe6" transform="rotate(-12 448 368)"/>
    <ellipse cx="446" cy="366" rx="8" ry="5" fill="#fffdf8" transform="rotate(-12 446 366)"/>
    <ellipse cx="320" cy="395" rx="12" ry="8" fill="#f5f2ea" transform="rotate(8 320 395)"/>
    <ellipse cx="318" cy="393" rx="8" ry="5" fill="#fffef9" transform="rotate(8 318 393)"/>
    <ellipse cx="490" cy="345" rx="11" ry="7" fill="#f0ede5" transform="rotate(-18 490 345)"/>
    <ellipse cx="488" cy="343" rx="7" ry="5" fill="#fffdf8" transform="rotate(-18 488 343)"/>
    <ellipse cx="415" cy="432" rx="13" ry="8" fill="#f5f2ea" transform="rotate(15 415 432)"/>
    <ellipse cx="413" cy="430" rx="8" ry="5" fill="#fffef9" transform="rotate(15 413 430)"/>
    <ellipse cx="280" cy="368" rx="10" ry="7" fill="#f2efe7" transform="rotate(-5 280 368)"/>
    <ellipse cx="278" cy="366" rx="6" ry="4" fill="#fffdf8" transform="rotate(-5 278 366)"/>
  </g>

  <!-- Walnut pieces scattered on top -->
  <!-- Walnut 1 - larger half piece -->
  <g transform="translate(360 310) rotate(15)">
    <path d="M0-14 Q14-12 16 0 Q14 14 0 14 Q-14 14 -16 0 Q-14-12 0-14 Z" fill="url(#pccn-walnut1)"/>
    <path d="M0-14 Q4-8 2 0 Q4 8 0 14 Q-4 8 -2 0 Q-4-8 0-14 Z" fill="#6a3810" opacity="0.5"/>
    <path d="M-16 0 Q-8-3 -2 0 Q-8 3 -16 0 Z" fill="#6a3810" opacity="0.4"/>
    <path d="M16 0 Q8-3 2 0 Q8 3 16 0 Z" fill="#6a3810" opacity="0.4"/>
  </g>
  <!-- Walnut 2 - smaller chunk -->
  <g transform="translate(460 298) rotate(-20)">
    <path d="M0-10 Q10-8 11 0 Q10 10 0 11 Q-10 10 -11 0 Q-10-8 0-10 Z" fill="url(#pccn-walnut2)"/>
    <path d="M0-10 Q3-5 1 0 Q3 5 0 11 Q-3 5 -1 0 Q-3-5 0-10 Z" fill="#5a2808" opacity="0.5"/>
  </g>
  <!-- Walnut 3 - quarter piece -->
  <g transform="translate(300 320) rotate(30)">
    <path d="M0 0 Q12-10 16 0 Q12 8 0 12 Q-4 8 0 0 Z" fill="url(#pccn-walnut3)"/>
    <path d="M0 0 Q4-5 0 12 Q-4 5 0 0 Z" fill="#6a3810" opacity="0.4"/>
  </g>
  <!-- Walnut 4 - small piece -->
  <g transform="translate(510 315) rotate(-8)">
    <path d="M0-8 Q8-7 9 0 Q8 8 0 9 Q-8 8 -9 0 Q-8-7 0-8 Z" fill="url(#pccn-walnut1)"/>
    <path d="M0-8 Q3-4 1 0 Q3 4 0 9 Q-3 4 -1 0 Q-3-4 0-8 Z" fill="#6a3810" opacity="0.5"/>
  </g>
  <!-- Walnut 5 - tiny fragments -->
  <ellipse cx="420" cy="305" rx="7" ry="5" fill="#b88030" transform="rotate(25 420 305)"/>
  <ellipse cx="380" cy="428" rx="8" ry="5" fill="#c89040" transform="rotate(-10 380 428)"/>
  <ellipse cx="330" cy="415" rx="6" ry="4" fill="#b07828" transform="rotate(18 330 415)"/>
  <ellipse cx="480" cy="408" rx="7" ry="5" fill="#c08838" transform="rotate(-25 480 408)"/>

  <!-- Cream sauce drizzle highlights -->
  <path d="M320 350 Q360 340 400 355 Q440 368 480 352" stroke="#f8f4e8" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M350 390 Q385 378 420 388 Q450 396 475 385" stroke="#f8f4e8" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Bowl rim highlight -->
  <path d="M210 345 Q400 310 590 345" stroke="#e8dfc8" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Bowl rim top edge -->
  <ellipse cx="400" cy="480" rx="195" ry="30" fill="none" stroke="#d8cfc0" stroke-width="2" opacity="0.6"/>

  <!-- Ambient warm light -->
  <radialGradient id="pccn-glow" cx="50%" cy="40%" r="45%">
    <stop offset="0%" stop-color="#f8e8a0" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#f8e8a0" stop-opacity="0"/>
  </radialGradient>
  <rect width="800" height="600" fill="url(#pccn-glow)"/>
</svg>

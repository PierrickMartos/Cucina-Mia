  <circle cx="220" cy="300" r="28" fill="url(#gblemon)" opacity="0.9"/>
  <circle cx="220" cy="300" r="24" fill="#e8d838" opacity="0.6"/>
  <line x1="220" y1="276" x2="220" y2="324" stroke="#c8a818" stroke-width="1.2" opacity="0.6"/>
  <line x1="196" y1="300" x2="244" y2="300" stroke="#c8a818" stroke-width="1.2" opacity="0.6"/>
  <line x1="203" y1="283" x2="237" y2="317" stroke="#c8a818" stroke-width="1" opacity="0.4"/>
  <line x1="237" y1="283" x2="203" y2="317" stroke="#c8a818" stroke-width="1" opacity="0.4"/>

  <circle cx="575" cy="360" r="24" fill="url(#gblemon)" opacity="0.85"/>
  <circle cx="575" cy="360" r="20" fill="#e8d838" opacity="0.5"/>
  <line x1="575" y1="336" x2="575" y2="384" stroke="#c8a818" stroke-width="1" opacity="0.5"/>
  <line x1="551" y1="360" x2="599" y2="360" stroke="#c8a818" stroke-width="1" opacity="0.5"/>

  <!-- Broccoli florets -->
  <!-- Floret 1 -->
  <ellipse cx="310" cy="250" rx="28" ry="22" fill="url(#gbbr)"/>
  <ellipse cx="295" cy="244" rx="16" ry="14" fill="#3a9828"/>
  <ellipse cx="318" cy="240" rx="14" ry="12" fill="#4ab030"/>
  <ellipse cx="308" cy="258" rx="12" ry="10" fill="#308822"/>
  <rect x="306" y="268" width="8" height="14" rx="3" fill="#287018" opacity="0.7"/>

  <!-- Floret 2 -->
  <ellipse cx="480" cy="235" rx="26" ry="20" fill="url(#gbbr)"/>
  <ellipse cx="467" cy="229" rx="14" ry="12" fill="#3a9828"/>
  <ellipse cx="486" cy="225" rx="13" ry="11" fill="#4ab030"/>
  <ellipse cx="476" cy="243" rx="11" ry="9" fill="#308822"/>
  <rect x="474" y="252" width="7" height="12" rx="3" fill="#287018" opacity="0.7"/>

  <!-- Floret 3 (more roasted/darker) -->
  <ellipse cx="375" cy="390" rx="24" ry="18" fill="#287018"/>
  <ellipse cx="362" cy="384" rx="13" ry="11" fill="#308820"/>
  <ellipse cx="381" cy="380" rx="12" ry="10" fill="#287018"/>
  <ellipse cx="371" cy="396" rx="10" ry="8" fill="#1e5810"/>
  <rect x="369" y="404" width="6" height="10" rx="3" fill="#1e5810" opacity="0.7"/>

  <!-- Floret 4 -->
  <ellipse cx="630" cy="270" rx="22" ry="17" fill="url(#gbbr)"/>
  <ellipse cx="619" cy="265" rx="12" ry="10" fill="#3a9828"/>
  <ellipse cx="634" cy="261" rx="11" ry="9" fill="#4ab030"/>
  <ellipse cx="626" cy="277" rx="9" ry="8" fill="#308822"/>

  <!-- Floret 5 (partially charred) -->
  <ellipse cx="165" cy="380" rx="20" ry="16" fill="#287018"/>
  <ellipse cx="155" cy="375" rx="11" ry="9" fill="#1e6014"/>
  <ellipse cx="170" cy="371" rx="10" ry="8" fill="#287018"/>

  <!-- Gnocchi pieces - golden roasted -->
  <!-- Row across middle -->
  <ellipse cx="260" cy="320" rx="20" ry="16" fill="url(#gbgn)"/>
  <ellipse cx="260" cy="318" rx="17" ry="13" fill="#f0c870" opacity="0.7"/>

  <ellipse cx="340" cy="300" rx="21" ry="17" fill="url(#gbgndark)"/>
  <ellipse cx="340" cy="298" rx="18" ry="14" fill="#d8a050" opacity="0.7"/>

  <ellipse cx="415" cy="315" rx="20" ry="16" fill="url(#gbgn)"/>
  <ellipse cx="415" cy="313" rx="17" ry="13" fill="#f0c870" opacity="0.7"/>

  <ellipse cx="500" cy="298" rx="21" ry="16" fill="url(#gbgndark)"/>
  <ellipse cx="500" cy="296" rx="18" ry="13" fill="#d8a050" opacity="0.7"/>

  <ellipse cx="560" cy="320" rx="19" ry="15" fill="url(#gbgn)"/>
  <ellipse cx="560" cy="318" rx="16" ry="12" fill="#f0c870" opacity="0.7"/>

  <ellipse cx="640" cy="340" rx="20" ry="16" fill="url(#gbgn)"/>
  <ellipse cx="640" cy="338" rx="17" ry="13" fill="#f0c870" opacity="0.7"/>

  <!-- Lower row -->
  <ellipse cx="200" cy="350" rx="19" ry="15" fill="url(#gbgndark)"/>
  <ellipse cx="200" cy="348" rx="16" ry="12" fill="#d8a050" opacity="0.7"/>

  <ellipse cx="285" cy="368" rx="20" ry="16" fill="url(#gbgn)"/>
  <ellipse cx="285" cy="366" rx="17" ry="13" fill="#f0c870" opacity="0.7"/>

  <ellipse cx="440" cy="370" rx="21" ry="16" fill="url(#gbgndark)"/>
  <ellipse cx="440" cy="368" rx="18" ry="13" fill="#d8a050" opacity="0.7"/>

  <ellipse cx="525" cy="388" rx="19" ry="15" fill="url(#gbgn)"/>
  <ellipse cx="525" cy="386" rx="16" ry="12" fill="#f0c870" opacity="0.7"/>

  <ellipse cx="610" cy="400" rx="20" ry="15" fill="url(#gbgndark)"/>
  <ellipse cx="610" cy="398" rx="17" ry="12" fill="#d8a050" opacity="0.7"/>

  <!-- Upper scattered gnocchi -->
  <ellipse cx="185" cy="255" rx="17" ry="13" fill="url(#gbgn)"/>
  <ellipse cx="185" cy="253" rx="14" ry="11" fill="#f0c870" opacity="0.7"/>

  <ellipse cx="545" cy="255" rx="18" ry="14" fill="url(#gbgndark)"/>
  <ellipse cx="545" cy="253" rx="15" ry="11" fill="#d8a050" opacity="0.7"/>

  <!-- Roasted dark spots on some gnocchi -->
  <ellipse cx="341" cy="300" rx="6" ry="4" fill="#8a4810" opacity="0.4"/>
  <ellipse cx="501" cy="299" rx="5" ry="3" fill="#8a4810" opacity="0.4"/>
  <ellipse cx="611" cy="399" rx="5" ry="3" fill="#8a4810" opacity="0.35"/>

  <!-- Pecorino cheese shavings -->
  <g fill="#faf6e8" opacity="0.75">
    <ellipse cx="370" cy="285" rx="14" ry="4" transform="rotate(-18 370 285)"/>
    <ellipse cx="450" cy="335" rx="12" ry="3.5" transform="rotate(22 450 335)"/>
    <ellipse cx="310" cy="340" rx="10" ry="3" transform="rotate(-8 310 340)"/>
    <ellipse cx="490" cy="360" rx="13" ry="4" transform="rotate(35 490 360)"/>
    <ellipse cx="580" cy="290" rx="11" ry="3.5" transform="rotate(-25 580 290)"/>
    <ellipse cx="250" cy="395" rx="10" ry="3" transform="rotate(12 250 395)"/>
    <ellipse cx="420" cy="255" rx="9" ry="3" transform="rotate(-30 420 255)"/>
  </g>

  <!-- Subtle herb specks (chili/herbs) -->
  <g fill="#c83818" opacity="0.5">
    <circle cx="355" cy="312" r="2"/>
    <circle cx="420" cy="348" r="1.5"/>
    <circle cx="480" cy="310" r="2"/>
    <circle cx="270" cy="355" r="1.5"/>
    <circle cx="540" cy="370" r="2"/>
  </g>
</svg>

      <stop offset="100%" stop-color="#a06020"/>
    </radialGradient>
    <radialGradient id="gbbr" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4aaa38"/>
      <stop offset="100%" stop-color="#287018"/>

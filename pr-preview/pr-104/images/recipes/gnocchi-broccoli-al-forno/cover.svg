<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="gbbg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2e2822"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
    <radialGradient id="gbtray" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9aacb4"/>
      <stop offset="100%" stop-color="#6a8090"/>
    </radialGradient>
    <radialGradient id="gbgn" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0c060"/>
      <stop offset="100%" stop-color="#c88030"/>
    </radialGradient>
    <radialGradient id="gbgndark" cx="40%" cy="30%" r="60%">

    <radialGradient id="gblemon" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0e040"/>
      <stop offset="100%" stop-color="#c8b020"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#gbbg)"/>
  <!-- Tray shadow -->
  <ellipse cx="400" cy="470" rx="300" ry="30" fill="#0a0808" opacity="0.4"/>
  <!-- Baking tray body -->
  <rect x="110" y="200" width="580" height="240" rx="12" fill="url(#gbtray)"/>
  <!-- Tray inner darker surface -->
  <rect x="122" y="212" width="556" height="216" rx="8" fill="#788a94" opacity="0.6"/>
  <!-- Tray rim highlight -->
  <rect x="110" y="200" width="580" height="12" rx="6" fill="#b0c4cc" opacity="0.5"/>
  <rect x="110" y="200" width="10" height="240" rx="5" fill="#b0c4cc" opacity="0.4"/>
  <rect x="680" y="200" width="10" height="240" rx="5" fill="#6a7c84" opacity="0.4"/>
  <!-- Tray inner shadow (roasting color) -->
  <rect x="122" y="212" width="556" height="216" rx="8" fill="#4a3820" opacity="0.3"/>


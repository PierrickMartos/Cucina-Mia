<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Background radial gradient - dark warm -->
    <radialGradient id="ram-bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3a2a0a"/>
      <stop offset="60%" stop-color="#1e1508"/>
      <stop offset="100%" stop-color="#0d0a04"/>
    </radialGradient>

    <!-- Table surface gradient -->
    <radialGradient id="ram-table-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a1e0a"/>
      <stop offset="100%" stop-color="#150f05"/>
    </radialGradient>

    <!-- Bowl outer gradient -->
    <radialGradient id="ram-bowl-outer" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d5a0"/>
      <stop offset="50%" stop-color="#c8b070"/>
      <stop offset="100%" stop-color="#8a6830"/>
    </radialGradient>

    <!-- Bowl inner shadow -->
    <radialGradient id="ram-bowl-inner-shadow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#6b4c15" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3a2a08" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Risotto surface gradient - golden saffron -->
    <radialGradient id="ram-risotto-grad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0e090"/>
      <stop offset="25%" stop-color="#e8c040"/>
      <stop offset="60%" stop-color="#d4a820"/>
      <stop offset="100%" stop-color="#b08010"/>
    </radialGradient>

    <!-- Creamy highlight on risotto -->
    <radialGradient id="ram-cream-highlight" cx="38%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#faf5c8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f0e090" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d4a820" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient glow around bowl -->
    <radialGradient id="ram-glow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#d4a820" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4a820" stop-opacity="0"/>
    </radialGradient>

    <!-- Parmesan highlight -->
    <radialGradient id="ram-parmesan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f5e8b0" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Bowl rim highlight -->
    <linearGradient id="ram-rim-highlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f5e8c0"/>
      <stop offset="40%" stop-color="#d4b870"/>
      <stop offset="100%" stop-color="#8a6830"/>
    </linearGradient>

    <!-- Soft shadow under bowl -->
    <radialGradient id="ram-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for soft glow effect -->
    <filter id="ram-blur-sm">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="ram-blur-md">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="ram-blur-lg">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Dark warm background -->
  <rect width="800" height="600" fill="url(#ram-bg-grad)"/>

  <!-- Subtle texture overlay - table surface -->
  <ellipse cx="400" cy="420" rx="380" ry="120" fill="url(#ram-table-grad)" opacity="0.6"/>

  <!-- Ambient golden glow around the bowl area -->
  <ellipse cx="400" cy="310" rx="260" ry="200" fill="url(#ram-glow)" filter="url(#ram-blur-lg)"/>

  <!-- Shadow under bowl -->
  <ellipse cx="400" cy="490" rx="175" ry="28" fill="url(#ram-shadow)" filter="url(#ram-blur-md)"/>

  <!-- Bowl outer body - deep ceramic plate/bowl shape -->
  <!-- Wide shallow bowl typical of risotto service -->
  <ellipse cx="400" cy="390" rx="220" ry="38" fill="url(#ram-bowl-outer)"/>
  <path d="M 180 390 Q 180 310 400 305 Q 620 310 620 390 Z" fill="url(#ram-bowl-outer)"/>

  <!-- Bowl interior shadow/depth -->
  <ellipse cx="400" cy="355" rx="195" ry="55" fill="url(#ram-bowl-inner-shadow)"/>

  <!-- Risotto surface - golden saffron color, slightly domed -->
  <ellipse cx="400" cy="348" rx="185" ry="50" fill="url(#ram-risotto-grad)"/>

  <!-- Risotto texture - subtle rice grain bumps -->
  <!-- Row of rice grain shapes to suggest texture -->
  <g opacity="0.35" fill="#c09020">
    <ellipse cx="330" cy="345" rx="8" ry="4" transform="rotate(-15 330 345)"/>
    <ellipse cx="355" cy="338" rx="7" ry="3.5" transform="rotate(10 355 338)"/>
    <ellipse cx="380" cy="342" rx="9" ry="4" transform="rotate(-5 380 342)"/>
    <ellipse cx="408" cy="336" rx="8" ry="3.5" transform="rotate(20 408 336)"/>
    <ellipse cx="435" cy="343" rx="7" ry="4" transform="rotate(-10 435 343)"/>
    <ellipse cx="460" cy="339" rx="8" ry="3.5" transform="rotate(8 460 339)"/>
    <ellipse cx="315" cy="358" rx="7" ry="3.5" transform="rotate(12 315 358)"/>
    <ellipse cx="342" cy="360" rx="9" ry="4" transform="rotate(-8 342 360)"/>
    <ellipse cx="370" cy="355" rx="8" ry="3.5" transform="rotate(5 370 355)"/>
    <ellipse cx="396" cy="360" rx="7" ry="4" transform="rotate(-18 396 360)"/>
    <ellipse cx="422" cy="356" rx="9" ry="3.5" transform="rotate(12 422 356)"/>
    <ellipse cx="450" cy="361" rx="7" ry="4" transform="rotate(-6 450 361)"/>
    <ellipse cx="475" cy="352" rx="8" ry="3.5" transform="rotate(15 475 352)"/>
    <ellipse cx="300" cy="370" rx="7" ry="3.5" transform="rotate(-10 300 370)"/>
    <ellipse cx="328" cy="372" rx="8" ry="4" transform="rotate(8 328 372)"/>
    <ellipse cx="358" cy="368" rx="7" ry="3.5" transform="rotate(-14 358 368)"/>
    <ellipse cx="386" cy="373" rx="9" ry="4" transform="rotate(6 386 373)"/>
    <ellipse cx="414" cy="369" rx="7" ry="3.5" transform="rotate(-10 414 369)"/>
    <ellipse cx="442" cy="374" rx="8" ry="4" transform="rotate(16 442 374)"/>
    <ellipse cx="468" cy="367" rx="7" ry="3.5" transform="rotate(-5 468 367)"/>
    <ellipse cx="490" cy="360" rx="6" ry="3" transform="rotate(10 490 360)"/>
  </g>

  <!-- Creamy highlight on risotto surface - the mantecatura sheen -->
  <ellipse cx="385" cy="340" rx="140" ry="38" fill="url(#ram-cream-highlight)"/>

  <!-- Parmesan dusting - fine white powder scattered over top -->
  <g opacity="0.7" filter="url(#ram-blur-sm)">
    <ellipse cx="370" cy="332" rx="18" ry="6" fill="url(#ram-parmesan)" opacity="0.6"/>
    <ellipse cx="420" cy="338" rx="14" ry="5" fill="url(#ram-parmesan)" opacity="0.5"/>
    <ellipse cx="395" cy="345" rx="16" ry="5" fill="url(#ram-parmesan)" opacity="0.55"/>
    <ellipse cx="350" cy="342" rx="12" ry="4" fill="url(#ram-parmesan)" opacity="0.45"/>
    <ellipse cx="440" cy="333" rx="10" ry="4" fill="url(#ram-parmesan)" opacity="0.5"/>
  </g>

  <!-- Parmesan crisper pieces on top -->
  <g opacity="0.82" fill="#faf5d0">
    <ellipse cx="372" cy="334" rx="6" ry="2.5" transform="rotate(-20 372 334)"/>
    <ellipse cx="410" cy="330" rx="5" ry="2" transform="rotate(15 410 330)"/>
    <ellipse cx="388" cy="340" rx="7" ry="2.5" transform="rotate(5 388 340)"/>
    <ellipse cx="430" cy="337" rx="5" ry="2" transform="rotate(-12 430 337)"/>
    <ellipse cx="355" cy="337" rx="4" ry="2" transform="rotate(18 355 337)"/>
  </g>

  <!-- Saffron threads garnish - bright orange-red filaments -->
  <!-- Thread 1 - curved across center -->
  <path d="M 365 325 Q 380 318 395 322 Q 410 328 420 321" stroke="#ff8800" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Thread 2 -->
  <path d="M 378 335 Q 390 328 402 332" stroke="#ff9900" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- Thread 3 - slightly off center -->
  <path d="M 350 330 Q 358 323 368 328 Q 374 332 380 327" stroke="#ff7700" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Thread 4 - right side -->
  <path d="M 415 328 Q 425 322 435 326 Q 440 330 448 325" stroke="#ff8800" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Thread 5 - subtle -->
  <path d="M 392 345 Q 400 340 412 343" stroke="#ffaa00" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Thread dots (stigmas) -->
  <circle cx="365" cy="325" r="1.5" fill="#ff6600" opacity="0.9"/>
  <circle cx="395" cy="322" r="1.5" fill="#ff7700" opacity="0.85"/>
  <circle cx="420" cy="321" r="1.5" fill="#ff6600" opacity="0.9"/>
  <circle cx="350" cy="330" r="1.2" fill="#ff8800" opacity="0.8"/>
  <circle cx="368" cy="328" r="1.2" fill="#ff7700" opacity="0.8"/>
  <circle cx="435" cy="326" r="1.2" fill="#ff6600" opacity="0.85"/>
  <circle cx="448" cy="325" r="1.2" fill="#ff8800" opacity="0.75"/>

  <!-- Bowl rim highlight - top edge of wide bowl -->
  <ellipse cx="400" cy="310" rx="220" ry="30" fill="none" stroke="url(#ram-rim-highlight)" stroke-width="3" opacity="0.7"/>

  <!-- Bowl rim top surface - subtle highlight -->
  <path d="M 182 310 Q 290 278 400 275 Q 510 278 618 310" fill="none" stroke="#e8d5a0" stroke-width="1.5" opacity="0.4"/>

  <!-- Bottom bowl plate edge -->
  <ellipse cx="400" cy="392" rx="220" ry="38" fill="none" stroke="#c8a858" stroke-width="2" opacity="0.4"/>

  <!-- Warm ambient light particles scattered in background -->
  <g opacity="0.12" fill="#d4a820">
    <circle cx="150" cy="180" r="3" filter="url(#ram-blur-sm)"/>
    <circle cx="640" cy="150" r="2.5" filter="url(#ram-blur-sm)"/>
    <circle cx="680" cy="250" r="2" filter="url(#ram-blur-sm)"/>
    <circle cx="120" cy="300" r="2.5" filter="url(#ram-blur-sm)"/>
    <circle cx="700" cy="400" r="2" filter="url(#ram-blur-sm)"/>
    <circle cx="160" cy="450" r="3" filter="url(#ram-blur-sm)"/>
    <circle cx="620" cy="480" r="2" filter="url(#ram-blur-sm)"/>
  </g>

  <!-- Subtle steam wisps above bowl -->
  <g opacity="0.12" fill="none" stroke="#f0e090" stroke-width="2" stroke-linecap="round">
    <path d="M 360 290 Q 355 270 362 250 Q 368 232 363 215" filter="url(#ram-blur-sm)"/>
    <path d="M 400 285 Q 394 262 400 242 Q 406 224 400 205" filter="url(#ram-blur-sm)"/>
    <path d="M 440 290 Q 446 268 440 248 Q 434 230 440 212" filter="url(#ram-blur-sm)"/>
  </g>
</svg>

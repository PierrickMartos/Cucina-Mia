<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="ptbg" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#302822"/><stop offset="100%" stop-color="#1a1510"/></radialGradient>
    <radialGradient id="ptdough" cx="48%" cy="44%" r="45%"><stop offset="0%" stop-color="#e8d4a8"/><stop offset="100%" stop-color="#c8b080"/></radialGradient>
    <radialGradient id="ptpan" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6a6a6a"/><stop offset="100%" stop-color="#484848"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ptbg)"/>
  <!-- Wooden surface grain -->
  <g opacity="0.06" stroke="#a08860" stroke-width="0.8">
    <line x1="0" y1="480" x2="800" y2="478"/><line x1="0" y1="500" x2="800" y2="502"/>
    <line x1="0" y1="520" x2="800" y2="518"/><line x1="0" y1="540" x2="800" y2="542"/>
  </g>
  <!-- Shadow under pan -->
  <ellipse cx="400" cy="380" rx="200" ry="35" fill="#0a0806" opacity="0.45"/>
  <!-- Pie pan -->
  <ellipse cx="400" cy="310" rx="190" ry="60" fill="url(#ptpan)"/>
  <ellipse cx="400" cy="310" rx="190" ry="60" fill="#888" opacity="0.15"/>
  <!-- Pan rim -->
  <ellipse cx="400" cy="310" rx="190" ry="60" fill="none" stroke="#7a7a7a" stroke-width="3"/>
  <ellipse cx="400" cy="310" rx="175" ry="52" fill="none" stroke="#5a5a5a" stroke-width="1"/>
  <!-- Fluted edge -->
  <g fill="#777" opacity="0.3">
    <ellipse cx="220" cy="308" rx="8" ry="12"/><ellipse cx="240" cy="298" rx="8" ry="12"/>
    <ellipse cx="265" cy="290" rx="8" ry="11"/><ellipse cx="293" cy="283" rx="8" ry="10"/>
    <ellipse cx="323" cy="278" rx="8" ry="10"/><ellipse cx="355" cy="275" rx="8" ry="10"/>
    <ellipse cx="400" cy="274" rx="8" ry="10"/><ellipse cx="445" cy="275" rx="8" ry="10"/>
    <ellipse cx="477" cy="278" rx="8" ry="10"/><ellipse cx="507" cy="283" rx="8" ry="10"/>
    <ellipse cx="535" cy="290" rx="8" ry="11"/><ellipse cx="560" cy="298" rx="8" ry="12"/>
    <ellipse cx="580" cy="308" rx="8" ry="12"/>
  </g>
  <!-- Dough in pan -->
  <ellipse cx="400" cy="312" rx="170" ry="48" fill="url(#ptdough)"/>
  <!-- Dough texture -->
  <ellipse cx="400" cy="312" rx="170" ry="48" fill="#d8c498" opacity="0.3"/>
  <!-- Fork holes pattern -->
  <g fill="#b09868" opacity="0.5">
    <circle cx="340" cy="300" r="2"/><circle cx="340" cy="308" r="2"/><circle cx="340" cy="316" r="2"/>
    <circle cx="360" cy="296" r="2"/><circle cx="360" cy="304" r="2"/><circle cx="360" cy="312" r="2"/>
    <circle cx="380" cy="294" r="2"/><circle cx="380" cy="302" r="2"/><circle cx="380" cy="310" r="2"/>
    <circle cx="400" cy="293" r="2"/><circle cx="400" cy="301" r="2"/><circle cx="400" cy="309" r="2"/>
    <circle cx="420" cy="294" r="2"/><circle cx="420" cy="302" r="2"/><circle cx="420" cy="310" r="2"/>
    <circle cx="440" cy="296" r="2"/><circle cx="440" cy="304" r="2"/><circle cx="440" cy="312" r="2"/>
    <circle cx="460" cy="300" r="2"/><circle cx="460" cy="308" r="2"/><circle cx="460" cy="316" r="2"/>
  </g>
  <!-- Rolling pin -->
  <g transform="translate(180, 180) rotate(-20)">
    <rect x="0" y="-10" width="160" height="20" rx="10" fill="#a07840" opacity="0.7"/>
    <rect x="-30" y="-6" width="35" height="12" rx="4" fill="#806030" opacity="0.7"/>
    <rect x="155" y="-6" width="35" height="12" rx="4" fill="#806030" opacity="0.7"/>
  </g>
  <!-- Flour container (tupperware) -->
  <g transform="translate(580, 200)">
    <rect x="0" y="0" width="70" height="55" rx="6" fill="#b8d8e8" opacity="0.4"/>
    <rect x="-2" y="-4" width="74" height="10" rx="4" fill="#90b8c8" opacity="0.4"/>
  </g>
  <!-- Scattered flour -->
  <g fill="#f0e8d8" opacity="0.12">
    <circle cx="300" cy="200" r="25"/><circle cx="500" cy="190" r="18"/>
    <circle cx="250" cy="380" r="12"/><circle cx="550" cy="370" r="15"/>
  </g>
  <!-- Flour dust particles -->
  <g fill="#f5ede0" opacity="0.2">
    <circle cx="320" cy="230" r="1.5"/><circle cx="480" cy="210" r="1"/>
    <circle cx="350" cy="400" r="1.2"/><circle cx="520" cy="395" r="1"/>
    <circle cx="270" cy="260" r="1"/><circle cx="540" cy="250" r="1.3"/>
  </g>
</svg>

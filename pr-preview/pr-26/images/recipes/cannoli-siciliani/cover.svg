<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="csbg" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#2a2520"/><stop offset="100%" stop-color="#141210"/></radialGradient>
    <linearGradient id="csshell" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c08830"/><stop offset="50%" stop-color="#d8a040"/><stop offset="100%" stop-color="#c08830"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#csbg)"/>
  <!-- Marble surface hint -->
  <rect x="100" y="280" width="600" height="200" rx="8" fill="#e8e0d8" opacity="0.06"/>
  <!-- Cannolo 1 (center, angled) -->
  <g transform="translate(400, 300) rotate(-10)">
    <!-- Shell -->
    <rect x="-80" y="-22" width="160" height="44" rx="22" fill="url(#csshell)"/>
    <!-- Shell bubbles texture -->
    <g fill="#b07828" opacity="0.4">
      <circle cx="-40" cy="-5" r="4"/><circle cx="-15" cy="8" r="3"/>
      <circle cx="20" cy="-8" r="3.5"/><circle cx="50" cy="5" r="3"/>
      <circle cx="-55" cy="6" r="2.5"/><circle cx="35" cy="10" r="2.5"/>
      <circle cx="65" cy="-3" r="3"/>
    </g>
    <!-- Ricotta filling left -->
    <ellipse cx="-80" cy="0" rx="18" ry="20" fill="#f8f4ee"/>
    <ellipse cx="-80" cy="0" rx="14" ry="16" fill="#faf8f2"/>
    <!-- Ricotta filling right -->
    <ellipse cx="80" cy="0" rx="18" ry="20" fill="#f8f4ee"/>
    <ellipse cx="80" cy="0" rx="14" ry="16" fill="#faf8f2"/>
    <!-- Chocolate chips in ricotta -->
    <g fill="#3a2018">
      <circle cx="-82" cy="-6" r="2.5"/><circle cx="-76" cy="5" r="2"/>
      <circle cx="-85" cy="3" r="1.8"/>
      <circle cx="78" cy="-5" r="2.5"/><circle cx="84" cy="4" r="2"/>
      <circle cx="76" cy="6" r="1.8"/>
    </g>
    <!-- Pistachios on ends -->
    <g fill="#5a9a30" opacity="0.8">
      <circle cx="-92" cy="-3" r="2.5"/><circle cx="-88" cy="6" r="2"/>
      <circle cx="-95" cy="4" r="1.8"/><circle cx="-86" cy="-7" r="2"/>
      <circle cx="92" cy="-2" r="2.5"/><circle cx="88" cy="7" r="2"/>
      <circle cx="95" cy="5" r="1.8"/><circle cx="86" cy="-6" r="2"/>
    </g>
  </g>
  <!-- Cannolo 2 (top left) -->
  <g transform="translate(270, 260) rotate(15)">
    <rect x="-70" y="-20" width="140" height="40" rx="20" fill="url(#csshell)"/>
    <g fill="#b07828" opacity="0.4">
      <circle cx="-30" cy="-4" r="3.5"/><circle cx="10" cy="6" r="3"/>
      <circle cx="40" cy="-6" r="2.5"/><circle cx="-50" cy="5" r="2.5"/>
    </g>
    <ellipse cx="-70" cy="0" rx="16" ry="18" fill="#f8f4ee"/>
    <ellipse cx="70" cy="0" rx="16" ry="18" fill="#f8f4ee"/>
    <g fill="#3a2018">
      <circle cx="-72" cy="-4" r="2"/><circle cx="-68" cy="4" r="1.8"/>
      <circle cx="68" cy="-4" r="2"/><circle cx="72" cy="5" r="1.8"/>
    </g>
    <g fill="#5a9a30" opacity="0.8">
      <circle cx="-82" cy="-1" r="2"/><circle cx="-78" cy="5" r="1.8"/>
      <circle cx="82" cy="0" r="2"/><circle cx="78" cy="6" r="1.8"/>
    </g>
  </g>
  <!-- Cannolo 3 (bottom right) -->
  <g transform="translate(520, 340) rotate(-20)">
    <rect x="-70" y="-20" width="140" height="40" rx="20" fill="url(#csshell)"/>
    <g fill="#b07828" opacity="0.4">
      <circle cx="-35" cy="5" r="3"/><circle cx="15" cy="-5" r="3.5"/>
      <circle cx="45" cy="4" r="2.5"/><circle cx="-50" cy="-3" r="2.5"/>
    </g>
    <ellipse cx="-70" cy="0" rx="16" ry="18" fill="#f8f4ee"/>
    <ellipse cx="70" cy="0" rx="16" ry="18" fill="#f8f4ee"/>
    <g fill="#3a2018">
      <circle cx="-72" cy="3" r="2"/><circle cx="-68" cy="-5" r="1.8"/>
      <circle cx="68" cy="3" r="2"/><circle cx="72" cy="-4" r="1.8"/>
    </g>
    <g fill="#5a9a30" opacity="0.8">
      <circle cx="-82" cy="2" r="2"/><circle cx="-78" cy="-4" r="1.8"/>
      <circle cx="82" cy="1" r="2"/><circle cx="78" cy="-5" r="1.8"/>
    </g>
  </g>
  <!-- Powdered sugar dusting -->
  <g fill="#f8f4f0" opacity="0.15">
    <circle cx="350" cy="280" r="1.5"/><circle cx="420" cy="270" r="1"/>
    <circle cx="300" cy="310" r="1.2"/><circle cx="480" cy="325" r="1"/>
    <circle cx="380" cy="340" r="1.5"/><circle cx="440" cy="260" r="1"/>
    <circle cx="320" cy="290" r="1"/><circle cx="500" cy="300" r="1.2"/>
  </g>
</svg>

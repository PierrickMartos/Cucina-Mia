    <ellipse cx="340" cy="338" rx="8" ry="5" fill="#d8802a" transform="rotate(15 340 338)"/>
    <ellipse cx="460" cy="335" rx="7" ry="4" fill="#d8802a" transform="rotate(-10 460 335)"/>

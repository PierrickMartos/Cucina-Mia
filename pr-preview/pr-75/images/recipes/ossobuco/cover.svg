<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="obbg" cx="50%" cy="42%" r="70%"><stop offset="0%" stop-color="#302820"/><stop offset="100%" stop-color="#1a1510"/></radialGradient>
    <radialGradient id="obplate" cx="48%" cy="48%" r="50%"><stop offset="0%" stop-color="#f0ebe4"/><stop offset="80%" stop-color="#d9d0c4"/><stop offset="100%" stop-color="#c4b8a8"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#obbg)"/>
  <ellipse cx="405" cy="345" rx="208" ry="65" fill="#0d0a07" opacity="0.4"/>
  <ellipse cx="400" cy="330" rx="205" ry="60" fill="url(#obplate)"/>
  <ellipse cx="400" cy="330" rx="185" ry="52" fill="#e8e0d4"/>

    <circle cx="390" cy="290" r="3"/><circle cx="400" cy="285" r="2.5"/>
    <circle cx="410" cy="288" r="2.8"/><circle cx="395" cy="295" r="2"/>
    <circle cx="405" cy="292" r="2.5"/><circle cx="385" cy="287" r="2"/>
  </g>

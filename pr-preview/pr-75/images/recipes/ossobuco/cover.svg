  <g fill="#704020" opacity="0.4">
    <ellipse cx="360" cy="295" rx="15" ry="8" transform="rotate(-10 360 295)"/>
    <ellipse cx="440" cy="298" rx="14" ry="7" transform="rotate(12 440 298)"/>

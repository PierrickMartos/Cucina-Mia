<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="vbg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e2018"/>
      <stop offset="100%" stop-color="#0e100a"/>
    </radialGradient>
    <linearGradient id="vglass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="vcurd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d936"/>
      <stop offset="100%" stop-color="#e8c420"/>
    </linearGradient>
    <radialGradient id="vmeringue" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="100%" stop-color="#f0ece0"/>
    </radialGradient>
    <radialGradient id="vbrule" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#d4813a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d4813a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vcrumble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a05a"/>
      <stop offset="100%" stop-color="#a87830"/>
    </linearGradient>
    <!-- Lemon gradient for decoration -->
    <radialGradient id="vlemon" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f5e84a"/>
      <stop offset="100%" stop-color="#d4c018"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#vbg)"/>

  <!-- Subtle marble/slate texture lines -->
  <g stroke="#181a14" stroke-width="0.5" opacity="0.4">
    <path d="M0,180 Q200,175 400,182 Q600,188 800,180"/>
    <path d="M0,320 Q200,316 400,323 Q600,329 800,320"/>
    <path d="M0,480 Q200,476 400,483 Q600,489 800,480"/>
  </g>

  <!-- Background scattered lemon zest dots -->
  <g fill="#c8a020" opacity="0.06">
    <circle cx="80" cy="120" r="3"/><circle cx="720" cy="150" r="2.5"/>
    <circle cx="110" cy="460" r="2"/><circle cx="700" cy="430" r="3"/>
    <circle cx="150" cy="280" r="1.5"/><circle cx="660" cy="310" r="2"/>
    <circle cx="60" cy="350" r="2.5"/><circle cx="740" cy="280" r="2"/>
  </g>

  <!-- === LEFT VERRINE === -->
  <g transform="translate(195, 130)">
    <!-- Shadow -->
    <ellipse cx="80" cy="338" rx="72" ry="16" fill="#000000" opacity="0.4"/>
    <!-- Glass body -->
    <path d="M30,20 L28,320 Q28,330 38,330 L122,330 Q132,330 132,320 L130,20 Z" fill="#2a2e24" opacity="0.5"/>
    <!-- Crumble layer -->
    <rect x="32" y="268" width="96" height="52" rx="2" fill="url(#vcrumble)"/>
    <!-- Crumble texture -->
    <g fill="#b88840" opacity="0.6">
      <circle cx="45" cy="280" r="3.5"/><circle cx="60" cy="276" r="2.8"/>
      <circle cx="75" cy="283" r="3.2"/><circle cx="90" cy="273" r="2.5"/>
      <circle cx="105" cy="281" r="3.8"/><circle cx="118" cy="275" r="2.6"/>
      <circle cx="52" cy="292" r="2.4"/><circle cx="68" cy="298" r="3"/>
      <circle cx="82" cy="290" r="2.8"/><circle cx="98" cy="296" r="3.2"/>
      <circle cx="112" cy="291" r="2.2"/>
    </g>
    <g fill="#906020" opacity="0.25">
      <circle cx="48" cy="310" r="2.5"/><circle cx="70" cy="306" r="2"/>
      <circle cx="88" cy="312" r="3"/><circle cx="104" cy="308" r="2.2"/>
    </g>
    <!-- Lemon curd layer -->
    <rect x="32" y="175" width="96" height="97" fill="url(#vcurd)"/>
    <!-- Curd texture / ripple -->
    <path d="M32,195 Q55,190 80,196 Q105,202 128,195" stroke="#f0d010" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M32,215 Q60,210 80,218 Q100,224 128,216" stroke="#f0d010" stroke-width="1" fill="none" opacity="0.3"/>
    <ellipse cx="65" cy="200" rx="18" ry="4" fill="#fde950" opacity="0.3"/>
    <!-- Meringue base -->
    <path d="M32,175 Q45,160 60,168 Q72,155 80,165 Q88,152 100,162 Q112,150 128,160 L128,175 Z" fill="url(#vmeringue)"/>
    <!-- Meringue swirl peaks -->
    <path d="M40,175 Q38,160 44,148 Q50,136 52,125 Q56,113 58,105 Q62,113 64,124 Q68,138 68,150 Q70,162 68,175" fill="url(#vmeringue)" stroke="#e8e4d8" stroke-width="0.5"/>
    <path d="M62,175 Q60,163 66,152 Q72,140 74,130 Q78,120 80,112 Q84,121 86,132 Q90,143 90,154 Q90,164 88,175" fill="url(#vmeringue)" stroke="#e8e4d8" stroke-width="0.5"/>
    <path d="M84,175 Q82,161 88,149 Q94,137 96,127 Q100,116 102,108 Q106,118 108,130 Q112,142 112,153 Q110,165 108,175" fill="url(#vmeringue)" stroke="#e8e4d8" stroke-width="0.5"/>
    <!-- Brûlée coloring on meringue tips -->
    <ellipse cx="54" cy="115" rx="10" ry="8" fill="url(#vbrule)" opacity="0.7"/>
    <ellipse cx="80" cy="120" rx="10" ry="8" fill="url(#vbrule)" opacity="0.6"/>
    <ellipse cx="104" cy="118" rx="10" ry="8" fill="url(#vbrule)" opacity="0.65"/>
    <!-- Glass walls overlay -->
    <path d="M30,20 L28,320 Q28,330 38,330 L122,330 Q132,330 132,320 L130,20 Z" fill="url(#vglass)"/>
    <!-- Glass left edge shine -->
    <path d="M32,30 L31,315" stroke="white" stroke-width="2.5" opacity="0.1" stroke-linecap="round"/>
    <!-- Glass rim -->
    <rect x="26" y="14" width="108" height="12" rx="6" fill="#3a4030" stroke="#505848" stroke-width="1"/>
    <rect x="28" y="14" width="104" height="6" rx="3" fill="white" opacity="0.07"/>
  </g>

  <!-- === CENTER VERRINE (main, taller, fully visible) === -->
  <g transform="translate(330, 80)">
    <!-- Shadow -->
    <ellipse cx="90" cy="408" rx="84" ry="19" fill="#000000" opacity="0.45"/>
    <!-- Glass body -->
    <path d="M28,20 L24,385 Q24,398 38,398 L142,398 Q156,398 156,385 L152,20 Z" fill="#2a2e24" opacity="0.5"/>
    <!-- Crumble layer -->
    <rect x="28" y="330" width="124" height="62" rx="2" fill="url(#vcrumble)"/>
    <!-- Crumble texture -->
    <g fill="#b88840" opacity="0.65">
      <circle cx="42" cy="342" r="4"/><circle cx="60" cy="336" r="3.5"/>
      <circle cx="78" cy="345" r="4.5"/><circle cx="96" cy="334" r="3.2"/>
      <circle cx="115" cy="343" r="4.2"/><circle cx="133" cy="337" r="3"/>
      <circle cx="50" cy="358" r="3"/><circle cx="70" cy="365" r="3.8"/>
      <circle cx="88" cy="355" r="3.5"/><circle cx="106" cy="362" r="4"/>
      <circle cx="124" cy="356" r="2.8"/><circle cx="140" cy="360" r="3.2"/>
    </g>
    <g fill="#906020" opacity="0.3">
      <circle cx="55" cy="378" r="3"/><circle cx="80" cy="372" r="2.5"/>
      <circle cx="103" cy="376" r="3.5"/><circle cx="125" cy="371" r="2.8"/>
    </g>
    <!-- Lemon curd layer -->
    <rect x="28" y="210" width="124" height="124" fill="url(#vcurd)"/>
    <!-- Curd sheen -->
    <ellipse cx="72" cy="228" rx="28" ry="6" fill="#fde950" opacity="0.35"/>
    <path d="M28,235 Q60,228 90,237 Q118,244 152,234" stroke="#f5e020" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M28,260 Q65,253 90,262 Q118,270 152,259" stroke="#f0d010" stroke-width="1" fill="none" opacity="0.25"/>
    <!-- Meringue base fill -->
    <path d="M28,210 Q45,192 62,203 Q76,188 90,200 Q104,186 120,198 Q136,184 152,196 L152,210 Z" fill="url(#vmeringue)"/>
    <!-- Meringue piped swirl peaks (4 peaks) -->
    <path d="M34,210 Q30,195 36,180 Q42,164 44,150 Q48,136 50,124 Q54,136 56,150 Q60,165 60,180 Q60,196 58,210" fill="url(#vmeringue)" stroke="#ddd8c8" stroke-width="0.6"/>
    <path d="M58,210 Q54,196 60,182 Q66,167 68,154 Q72,140 74,128 Q78,140 80,154 Q84,168 84,183 Q84,197 82,210" fill="url(#vmeringue)" stroke="#ddd8c8" stroke-width="0.6"/>
    <path d="M82,210 Q78,194 84,180 Q90,165 92,151 Q96,137 98,125 Q102,137 104,151 Q108,167 108,181 Q108,196 106,210" fill="url(#vmeringue)" stroke="#ddd8c8" stroke-width="0.6"/>
    <path d="M106,210 Q102,194 108,179 Q114,163 116,149 Q120,135 122,123 Q126,135 128,150 Q132,165 132,180 Q132,196 130,210" fill="url(#vmeringue)" stroke="#ddd8c8" stroke-width="0.6"/>
    <!-- Second tier swirl bumps -->
    <path d="M44,165 Q40,155 46,144 Q50,133 52,124 Q56,133 58,143 Q60,155 58,164" fill="url(#vmeringue)" opacity="0.7"/>
    <path d="M68,170 Q64,159 70,147 Q74,136 76,127 Q80,136 82,147 Q84,159 82,169" fill="url(#vmeringue)" opacity="0.7"/>
    <path d="M92,168 Q88,157 94,145 Q98,134 100,125 Q104,134 106,145 Q108,157 106,167" fill="url(#vmeringue)" opacity="0.7"/>
    <!-- Brûlée golden tips -->
    <ellipse cx="50" cy="128" rx="13" ry="10" fill="#cc7228" opacity="0.55"/>
    <ellipse cx="74" cy="132" rx="13" ry="10" fill="#cc7228" opacity="0.5"/>
    <ellipse cx="98" cy="130" rx="13" ry="10" fill="#cc7228" opacity="0.52"/>
    <ellipse cx="122" cy="128" rx="13" ry="10" fill="#cc7228" opacity="0.48"/>
    <!-- Glass walls overlay -->
    <path d="M28,20 L24,385 Q24,398 38,398 L142,398 Q156,398 156,385 L152,20 Z" fill="url(#vglass)"/>
    <!-- Glass shine left -->
    <path d="M30,30 L28,380" stroke="white" stroke-width="3" opacity="0.09" stroke-linecap="round"/>
    <!-- Glass rim -->
    <rect x="22" y="12" width="136" height="14" rx="7" fill="#3a4030" stroke="#505848" stroke-width="1"/>
    <rect x="24" y="12" width="132" height="7" rx="3.5" fill="white" opacity="0.08"/>
  </g>

  <!-- === RIGHT VERRINE === -->
  <g transform="translate(555, 150)">
    <!-- Shadow -->
    <ellipse cx="72" cy="320" rx="65" ry="15" fill="#000000" opacity="0.35"/>
    <!-- Glass body -->
    <path d="M28,18 L26,300 Q26,310 36,310 L108,310 Q118,310 118,300 L116,18 Z" fill="#2a2e24" opacity="0.5"/>
    <!-- Crumble layer -->
    <rect x="30" y="252" width="84" height="48" rx="2" fill="url(#vcrumble)"/>
    <!-- Crumble texture -->
    <g fill="#b88840" opacity="0.6">
      <circle cx="43" cy="263" r="3.2"/><circle cx="57" cy="258" r="2.5"/>
      <circle cx="72" cy="266" r="3.5"/><circle cx="87" cy="256" r="2.8"/>
      <circle cx="101" cy="264" r="3"/><circle cx="50" cy="278" r="2.5"/>
      <circle cx="68" cy="283" r="3"/><circle cx="84" cy="276" r="2.8"/>
      <circle cx="97" cy="281" r="2.2"/>
    </g>
    <!-- Lemon curd layer -->
    <rect x="30" y="160" width="84" height="96" fill="url(#vcurd)"/>
    <ellipse cx="60" cy="176" rx="20" ry="4.5" fill="#fde950" opacity="0.3"/>
    <path d="M30,188 Q52,182 72,190 Q90,196 114,187" stroke="#f0d010" stroke-width="1" fill="none" opacity="0.3"/>
    <!-- Meringue base -->
    <path d="M30,160 Q42,145 56,155 Q66,142 72,152 Q80,140 90,150 Q100,138 114,148 L114,160 Z" fill="url(#vmeringue)"/>
    <!-- Meringue peaks -->
    <path d="M36,160 Q33,147 38,135 Q43,123 44,113 Q48,123 50,135 Q52,148 50,160" fill="url(#vmeringue)" stroke="#e0dcd0" stroke-width="0.5"/>
    <path d="M54,160 Q51,147 56,135 Q61,122 62,112 Q66,122 68,135 Q70,148 68,160" fill="url(#vmeringue)" stroke="#e0dcd0" stroke-width="0.5"/>
    <path d="M72,160 Q69,147 74,134 Q79,121 80,111 Q84,122 86,134 Q88,148 86,160" fill="url(#vmeringue)" stroke="#e0dcd0" stroke-width="0.5"/>
    <path d="M90,160 Q87,146 92,134 Q97,121 98,111 Q102,122 104,135 Q106,148 104,160" fill="url(#vmeringue)" stroke="#e0dcd0" stroke-width="0.5"/>
    <!-- Brûlée tips -->
    <ellipse cx="44" cy="116" rx="10" ry="8" fill="#c87025" opacity="0.6"/>
    <ellipse cx="63" cy="119" rx="10" ry="8" fill="#c87025" opacity="0.55"/>
    <ellipse cx="81" cy="117" rx="10" ry="8" fill="#c87025" opacity="0.58"/>
    <ellipse cx="99" cy="116" rx="10" ry="8" fill="#c87025" opacity="0.52"/>
    <!-- Glass walls overlay -->
    <path d="M28,18 L26,300 Q26,310 36,310 L108,310 Q118,310 118,300 L116,18 Z" fill="url(#vglass)"/>
    <path d="M30,28 L28,295" stroke="white" stroke-width="2" opacity="0.09" stroke-linecap="round"/>
    <!-- Glass rim -->
    <rect x="24" y="12" width="96" height="11" rx="5.5" fill="#3a4030" stroke="#505848" stroke-width="1"/>
    <rect x="26" y="12" width="92" height="5.5" rx="2.75" fill="white" opacity="0.07"/>
  </g>

  <!-- Lemon decoration bottom left -->
  <g transform="translate(88, 390)">
    <!-- Lemon body -->
    <ellipse cx="38" cy="45" rx="34" ry="26" fill="url(#vlemon)"/>
    <ellipse cx="38" cy="45" rx="34" ry="26" fill="none" stroke="#c8a018" stroke-width="1" opacity="0.5"/>
    <!-- Lemon tip -->
    <path d="M4,45 Q-2,40 -4,45 Q-2,50 4,45Z" fill="#d4b020"/>
    <path d="M72,45 Q78,40 80,45 Q78,50 72,45Z" fill="#d4b020"/>
    <!-- Lemon shine -->
    <ellipse cx="28" cy="36" rx="10" ry="6" fill="white" opacity="0.18"/>
    <!-- Lemon segment lines hint -->
    <g stroke="#c8a018" stroke-width="0.5" opacity="0.25">
      <line x1="38" y1="19" x2="38" y2="71"/>
      <line x1="12" y1="30" x2="64" y2="60"/>
      <line x1="12" y1="60" x2="64" y2="30"/>
    </g>
  </g>

  <!-- Half lemon slice -->
  <g transform="translate(670, 400)">
    <path d="M0,0 A40,40 0 0,1 80,0 Z" fill="url(#vlemon)" stroke="#c8a018" stroke-width="1" opacity="0.7"/>
    <path d="M10,0 A30,30 0 0,1 70,0 Z" fill="#f5e030" opacity="0.6"/>
    <!-- Segments -->
    <g stroke="#c8a018" stroke-width="0.6" opacity="0.35">
      <line x1="40" y1="0" x2="40" y2="-38"/>
      <line x1="40" y1="0" x2="8" y2="-19"/>
      <line x1="40" y1="0" x2="72" y2="-19"/>
    </g>
    <ellipse cx="40" cy="0" rx="8" ry="4" fill="#f0d820" opacity="0.5"/>
    <ellipse cx="28" cy="-8" rx="5" ry="3" fill="white" opacity="0.12"/>
  </g>

  <!-- Scattered powdered sugar dots near center verrine -->
  <g fill="white" opacity="0.18">
    <circle cx="320" cy="500" r="1.5"/><circle cx="340" cy="492" r="1"/>
    <circle cx="500" cy="498" r="1.5"/><circle cx="520" cy="488" r="1"/>
    <circle cx="310" cy="508" r="1"/><circle cx="510" cy="505" r="1"/>
    <circle cx="330" cy="515" r="0.8"/>
  </g>

  <!-- Lemon zest curls near left verrine -->
  <g stroke="#d4a820" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M155,490 Q160,482 168,488 Q175,494 170,502"/>
    <path d="M170,470 Q178,463 184,470 Q188,477 182,483"/>
    <path d="M650,480 Q655,472 663,478 Q670,484 665,492"/>
  </g>
</svg>

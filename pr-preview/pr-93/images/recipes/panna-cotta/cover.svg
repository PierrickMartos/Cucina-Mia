<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="pcbg2" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#2a2520"/><stop offset="100%" stop-color="#151210"/></radialGradient>
    <radialGradient id="pcpudding" cx="45%" cy="35%" r="50%"><stop offset="0%" stop-color="#faf6f0"/><stop offset="100%" stop-color="#e8ddd0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pcbg2)"/>
  <!-- Plate shadow -->
  <ellipse cx="405" cy="380" rx="180" ry="55" fill="#0d0a07" opacity="0.4"/>
  <!-- Plate -->
  <ellipse cx="400" cy="365" rx="175" ry="50" fill="#e8e0d4"/>
  <ellipse cx="400" cy="365" rx="155" ry="43" fill="#f5f0e8"/>

    <circle cx="388" cy="318" r="0.7"/><circle cx="400" cy="312" r="0.5"/>
    <circle cx="378" cy="322" r="0.6"/>
  </g>
  <!-- Berry sauce drip -->
  <path d="M420,338 Q425,345 428,355 Q430,362 425,368" fill="#8a1030" opacity="0.6" stroke="none"/>
  <!-- Berries on plate -->
  <g>
    <circle cx="445" cy="358" r="7" fill="#c01040"/><circle cx="445" cy="358" r="7" fill="white" opacity="0.1"/>
    <circle cx="460" cy="365" r="6" fill="#2020a0" opacity="0.8"/>
    <circle cx="435" cy="370" r="5" fill="#c01040"/>
    <circle cx="470" cy="360" r="5.5" fill="#2020a0" opacity="0.7"/>
    <circle cx="452" cy="375" r="4.5" fill="#c81848"/>
    <circle cx="345" cy="362" r="6" fill="#c01040"/>
    <circle cx="355" cy="370" r="5" fill="#2020a0" opacity="0.8"/>
    <circle cx="335" cy="372" r="4" fill="#c81848"/>
  </g>
  <!-- Raspberry texture -->

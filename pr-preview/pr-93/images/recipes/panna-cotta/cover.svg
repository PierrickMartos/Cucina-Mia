  <ellipse cx="360" cy="368" rx="40" ry="12" fill="#a01838" opacity="0.5"/>
  <!-- Panna cotta dome -->
  <ellipse cx="390" cy="340" rx="65" ry="28" fill="url(#pcpudding)"/>
  <ellipse cx="390" cy="310" rx="55" ry="38" fill="url(#pcpudding)"/>
  <!-- Sheen -->
  <ellipse cx="378" cy="298" rx="20" ry="12" fill="white" opacity="0.15"/>
  <!-- Vanilla specks -->
  <g fill="#2a2015" opacity="0.2">

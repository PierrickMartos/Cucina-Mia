  <!-- Basil leaf -->
  <path d="M35 17 C49 12 57 25 52 39 C41 38 33 30 35 17z" fill="#FDFCF0"/>
  <path d="M36.5 19 C42 24 46 30 50 36" fill="none" stroke="#A84C34" stroke-width="1.1" stroke-linecap="round"/>

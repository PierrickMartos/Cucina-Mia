<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="sun" cx="75%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="40%" stop-color="#FFF3CC"/>
      <stop offset="100%" stop-color="#F5E6B8"/>
    </radialGradient>
    <radialGradient id="bowl" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="80%" stop-color="#E8E0D4"/>
      <stop offset="100%" stop-color="#D4C9B8"/>
    </radialGradient>
    <radialGradient id="tomato" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#CC2222"/>
    </radialGradient>
    <radialGradient id="bread" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="100%" stop-color="#C4A44A"/>
    </radialGradient>
    <radialGradient id="olive" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#4A6B3A"/>
      <stop offset="100%" stop-color="#2D4A22"/>
    </radialGradient>
    <linearGradient id="basil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CB85C"/>
      <stop offset="100%" stop-color="#3D8B3D"/>
    </linearGradient>
    <linearGradient id="onion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A0D4"/>
      <stop offset="100%" stop-color="#9B6EAF"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Warm sunny background -->
  <rect width="800" height="600" fill="url(#sun)"/>

  <!-- Tablecloth pattern -->
  <rect x="0" y="380" width="800" height="220" fill="#F5E6D0" rx="0"/>
  <g opacity="0.15">
    <line x1="0" y1="400" x2="800" y2="400" stroke="#C4A060" stroke-width="2"/>
    <line x1="0" y1="430" x2="800" y2="430" stroke="#C4A060" stroke-width="2"/>
    <line x1="0" y1="460" x2="800" y2="460" stroke="#C4A060" stroke-width="2"/>
    <line x1="0" y1="490" x2="800" y2="490" stroke="#C4A060" stroke-width="2"/>
    <line x1="0" y1="520" x2="800" y2="520" stroke="#C4A060" stroke-width="2"/>
    <line x1="0" y1="550" x2="800" y2="550" stroke="#C4A060" stroke-width="2"/>
    <line x1="0" y1="580" x2="800" y2="580" stroke="#C4A060" stroke-width="2"/>
  </g>

  <!-- Bowl shadow -->
  <ellipse cx="400" cy="420" rx="210" ry="55" fill="#00000015"/>

  <!-- Bowl -->
  <ellipse cx="400" cy="340" rx="200" ry="120" fill="url(#bowl)" filter="url(#shadow)"/>
  <ellipse cx="400" cy="320" rx="190" ry="105" fill="#FAF6F0"/>

  <!-- Salad base - mixed greens -->
  <ellipse cx="400" cy="310" rx="170" ry="85" fill="#8BC34A" opacity="0.3"/>

  <!-- Bread cubes -->
  <rect x="310" y="270" width="35" height="30" rx="4" fill="url(#bread)" transform="rotate(-15 327 285)"/>
  <rect x="370" y="250" width="30" height="28" rx="4" fill="url(#bread)" transform="rotate(10 385 264)"/>
  <rect x="430" y="265" width="32" height="27" rx="4" fill="url(#bread)" transform="rotate(-8 446 278)"/>
  <rect x="350" y="310" width="28" height="25" rx="4" fill="url(#bread)" transform="rotate(20 364 322)"/>
  <rect x="460" y="300" width="30" height="28" rx="4" fill="url(#bread)" transform="rotate(-12 475 314)"/>
  <rect x="280" y="310" width="26" height="24" rx="4" fill="url(#bread)" transform="rotate(5 293 322)"/>
  <rect x="410" y="330" width="28" height="25" rx="4" fill="url(#bread)" transform="rotate(15 424 342)"/>

  <!-- Tomato halves -->
  <circle cx="340" cy="290" r="20" fill="url(#tomato)"/>
  <circle cx="340" cy="290" r="14" fill="#FF5555" opacity="0.5"/>
  <circle cx="470" cy="285" r="18" fill="url(#tomato)"/>
  <circle cx="470" cy="285" r="12" fill="#FF5555" opacity="0.5"/>
  <circle cx="390" cy="340" r="16" fill="url(#tomato)"/>
  <circle cx="390" cy="340" r="11" fill="#FF5555" opacity="0.5"/>
  <circle cx="310" cy="340" r="14" fill="url(#tomato)"/>
  <circle cx="490" cy="320" r="15" fill="url(#tomato)"/>

  <!-- Red onion slices -->
  <path d="M 440 340 Q 455 325 470 340" stroke="url(#onion)" stroke-width="4" fill="none"/>
  <path d="M 300" stroke="url(#onion)" stroke-width="3" fill="none"/>
  <ellipse cx="295" cy="295" rx="12" ry="6" fill="none" stroke="#B080C0" stroke-width="2.5" transform="rotate(-20 295 295)"/>

  <!-- Basil leaves -->
  <path d="M 420 270 Q 435 255 445 270 Q 435 280 420 270Z" fill="url(#basil)"/>
  <line x1="420" y1="270" x2="440" y2="268" stroke="#3D8B3D" stroke-width="1" opacity="0.5"/>
  <path d="M 350 335 Q 340 320 355 315 Q 365 325 350 335Z" fill="url(#basil)"/>
  <path d="M 500 300 Q 510 285 520 295 Q 510 308 500 300Z" fill="url(#basil)"/>
  <path d="M 265" fill="url(#basil)"/>
  <path d="M 270 275 Q 258 262 270 255 Q 280 265 270 275Z" fill="url(#basil)"/>

  <!-- Olive oil drizzle -->
  <path d="M 330 280 Q 370 275 410 285 Q 450 295 480 290" stroke="#C4A020" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 300 320 Q 340 315 380 325 Q 420 335 460 325" stroke="#C4A020" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Olive pieces -->
  <ellipse cx="375" cy="295" rx="8" ry="6" fill="url(#olive)"/>
  <ellipse cx="375" cy="295" rx="3" ry="2" fill="#2D4A22"/>
  <ellipse cx="445" cy="325" rx="7" ry="5" fill="url(#olive)" transform="rotate(30 445 325)"/>

  <!-- Bowl rim highlight -->
  <ellipse cx="400" cy="240" rx="185" ry="15" fill="white" opacity="0.3"/>

  <!-- Decorative sun rays -->
  <g opacity="0.08" transform="translate(650, 80)">
    <circle r="40" fill="#FFB800"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#FFB800" stroke-width="3"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#FFB800" stroke-width="3"/>
    <line x1="-45" y1="-45" x2="45" y2="45" stroke="#FFB800" stroke-width="3"/>
    <line x1="45" y1="-45" x2="-45" y2="45" stroke="#FFB800" stroke-width="3"/>
  </g>
</svg>

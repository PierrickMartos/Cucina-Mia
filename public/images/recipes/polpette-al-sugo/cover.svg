<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="psbg" cx="50%" cy="42%" r="70%"><stop offset="0%" stop-color="#2e2418"/><stop offset="100%" stop-color="#1a1108"/></radialGradient>
    <radialGradient id="psplate" cx="48%" cy="45%" r="52%"><stop offset="0%" stop-color="#f0ebe4"/><stop offset="80%" stop-color="#d9d0c4"/><stop offset="100%" stop-color="#c4b8a8"/></radialGradient>
    <radialGradient id="pssauce" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8a2a12"/><stop offset="100%" stop-color="#6a1e0e"/></radialGradient>
    <radialGradient id="psball1" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#a04828"/><stop offset="100%" stop-color="#6a2c14"/></radialGradient>
    <radialGradient id="psball2" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#9a4424"/><stop offset="100%" stop-color="#642810"/></radialGradient>
    <radialGradient id="psball3" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#a84e2e"/><stop offset="100%" stop-color="#6e3018"/></radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#psbg)"/>
  <!-- Table surface suggestion -->
  <rect x="0" y="440" width="800" height="160" fill="#1e1408" opacity="0.5"/>
  <!-- Plate shadow -->
  <ellipse cx="405" cy="368" rx="215" ry="62" fill="#0d0a05" opacity="0.45"/>
  <!-- Plate -->
  <ellipse cx="400" cy="355" rx="210" ry="58" fill="url(#psplate)"/>
  <ellipse cx="400" cy="355" rx="190" ry="50" fill="#e8e0d2"/>
  <ellipse cx="400" cy="355" rx="165" ry="43" fill="#f0e8de"/>
  <!-- Tomato sauce pool -->
  <ellipse cx="400" cy="352" rx="148" ry="38" fill="url(#pssauce)" opacity="0.85"/>
  <!-- Sauce shimmer -->
  <ellipse cx="375" cy="342" rx="40" ry="10" fill="#c03a1a" opacity="0.25" transform="rotate(-8 375 342)"/>
  <!-- Back meatball (partially hidden) -->
  <ellipse cx="400" cy="298" rx="36" ry="20" fill="#5a2410" opacity="0.6"/>
  <circle cx="400" cy="285" r="36" fill="url(#psball2)"/>
  <ellipse cx="388" cy="276" rx="10" ry="6" fill="#b85a34" opacity="0.4"/>
  <!-- Left meatball -->
  <ellipse cx="318" cy="335" rx="38" ry="22" fill="#5a2410" opacity="0.5"/>
  <circle cx="318" cy="322" r="38" fill="url(#psball1)"/>
  <ellipse cx="306" cy="312" rx="11" ry="7" fill="#c06040" opacity="0.4"/>
  <!-- Right meatball -->
  <ellipse cx="482" cy="335" rx="38" ry="22" fill="#5a2410" opacity="0.5"/>
  <circle cx="482" cy="322" r="38" fill="url(#psball3)"/>
  <ellipse cx="470" cy="312" rx="11" ry="7" fill="#c05838" opacity="0.4"/>
  <!-- Center front meatball -->
  <ellipse cx="400" cy="348" rx="40" ry="24" fill="#5a2410" opacity="0.55"/>
  <circle cx="400" cy="333" r="40" fill="url(#psball1)"/>
  <ellipse cx="386" cy="322" rx="13" ry="8" fill="#b85830" opacity="0.45"/>
  <!-- Sauce drips over meatballs -->
  <g opacity="0.55">
    <ellipse cx="400" cy="355" rx="28" ry="8" fill="#8a2a12"/>
    <ellipse cx="318" cy="342" rx="24" ry="7" fill="#8a2a12"/>
    <ellipse cx="482" cy="342" rx="24" ry="7" fill="#8a2a12"/>
  </g>
  <!-- Fresh herbs (basil/parsley) -->
  <g fill="#2a7a1a" opacity="0.82">
    <ellipse cx="400" cy="318" rx="9" ry="5" transform="rotate(-20 400 318)"/>
    <ellipse cx="413" cy="313" rx="8" ry="4.5" transform="rotate(15 413 313)"/>
    <ellipse cx="390" cy="312" rx="7" ry="4" transform="rotate(-30 390 312)"/>
    <ellipse cx="322" cy="306" rx="8" ry="4.5" transform="rotate(10 322 306)"/>
    <ellipse cx="332" cy="310" rx="7" ry="4" transform="rotate(-15 332 310)"/>
  </g>
  <!-- Herb stems -->
  <g stroke="#1e6012" stroke-width="1.2" opacity="0.6">
    <line x1="400" y1="323" x2="403" y2="330"/>
    <line x1="413" y1="317" x2="408" y2="325"/>
    <line x1="325" y1="315" x2="328" y2="322"/>
  </g>
  <!-- Scattered tomato sauce droplets in plate -->
  <g fill="#7a2010" opacity="0.4">
    <circle cx="350" cy="358" r="4"/>
    <circle cx="455" cy="362" r="3.5"/>
    <circle cx="300" cy="355" r="3"/>
    <circle cx="500" cy="350" r="3"/>
    <circle cx="370" cy="370" r="2.5"/>
    <circle cx="440" cy="368" r="2.5"/>
  </g>
  <!-- Parmesan shavings -->
  <g fill="#f0e8c8" opacity="0.5">
    <ellipse cx="420" cy="327" rx="6" ry="2" transform="rotate(25 420 327)"/>
    <ellipse cx="383" cy="324" rx="5" ry="1.8" transform="rotate(-18 383 324)"/>
    <ellipse cx="340" cy="316" rx="5" ry="2" transform="rotate(10 340 316)"/>
  </g>
</svg>

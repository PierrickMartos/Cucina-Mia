<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="pas-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2e2418"/>
      <stop offset="100%" stop-color="#160f08"/>
    </radialGradient>
    <radialGradient id="pas-plate" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f0ede8"/>
      <stop offset="100%" stop-color="#ccc8c0"/>
    </radialGradient>
    <radialGradient id="pas-sauce" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c0321a"/>
      <stop offset="60%" stop-color="#9e2510"/>
      <stop offset="100%" stop-color="#7a1a08"/>
    </radialGradient>
    <radialGradient id="pas-ball1" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#b8673a"/>
      <stop offset="50%" stop-color="#8b3e1e"/>
      <stop offset="100%" stop-color="#5e2410"/>
    </radialGradient>
    <radialGradient id="pas-ball2" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#c07040"/>
      <stop offset="50%" stop-color="#904222"/>
      <stop offset="100%" stop-color="#612810"/>
    </radialGradient>
    <radialGradient id="pas-ball3" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#b06035"/>
      <stop offset="50%" stop-color="#853a1c"/>
      <stop offset="100%" stop-color="#5a220e"/>
    </radialGradient>
    <filter id="pas-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00000088"/>
    </filter>
    <filter id="pas-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#pas-bg)"/>

  <!-- Ambient warm light -->
  <ellipse cx="400" cy="300" rx="320" ry="240" fill="#3d2510" opacity="0.4"/>

  <!-- Table surface -->
  <ellipse cx="400" cy="520" rx="380" ry="80" fill="#1e1208" opacity="0.7"/>

  <!-- Plate shadow -->
  <ellipse cx="400" cy="430" rx="210" ry="30" fill="#000000" opacity="0.45"/>

  <!-- Plate -->
  <ellipse cx="400" cy="360" rx="200" ry="185" fill="url(#pas-plate)" filter="url(#pas-shadow)"/>
  <ellipse cx="400" cy="355" rx="185" ry="170" fill="#e8e4de"/>
  <!-- Plate inner rim -->
  <ellipse cx="400" cy="358" rx="155" ry="142" fill="#f2efe9"/>

  <!-- Tomato sauce pool -->
  <ellipse cx="400" cy="370" rx="130" ry="105" fill="url(#pas-sauce)" opacity="0.92"/>
  <!-- Sauce shine -->
  <ellipse cx="370" cy="340" rx="35" ry="18" fill="#d94c2a" opacity="0.35" transform="rotate(-15 370 340)"/>

  <!-- Meatball 3 (back center) -->
  <circle cx="400" cy="315" r="38" fill="url(#pas-ball3)" filter="url(#pas-shadow)"/>
  <circle cx="390" cy="305" r="10" fill="#c87848" opacity="0.45"/>
  <circle cx="408" cy="300" r="5" fill="#d08050" opacity="0.3"/>

  <!-- Meatball 1 (front left) -->
  <circle cx="348" cy="385" r="42" fill="url(#pas-ball1)" filter="url(#pas-shadow)"/>
  <circle cx="336" cy="373" r="12" fill="#cc8050" opacity="0.4"/>
  <circle cx="355" cy="368" r="6" fill="#d48858" opacity="0.28"/>

  <!-- Meatball 2 (front right) -->
  <circle cx="456" cy="382" r="42" fill="url(#pas-ball2)" filter="url(#pas-shadow)"/>
  <circle cx="445" cy="370" r="12" fill="#c87845" opacity="0.42"/>
  <circle cx="464" cy="365" r="6" fill="#d08850" opacity="0.3"/>

  <!-- Sauce drips over meatballs -->
  <ellipse cx="400" cy="340" rx="30" ry="10" fill="#b02c15" opacity="0.55"/>
  <ellipse cx="348" cy="400" rx="28" ry="10" fill="#a82810" opacity="0.5"/>
  <ellipse cx="456" cy="397" rx="28" ry="10" fill="#b03015" opacity="0.5"/>

  <!-- Basil leaves -->
  <ellipse cx="382" cy="295" rx="16" ry="8" fill="#2d7a30" opacity="0.88" transform="rotate(-30 382 295)"/>
  <ellipse cx="385" cy="293" rx="7" ry="3" fill="#3d9a40" opacity="0.6" transform="rotate(-30 385 293)"/>
  <ellipse cx="420" cy="300" rx="14" ry="7" fill="#257028" opacity="0.85" transform="rotate(20 420 300)"/>
  <ellipse cx="423" cy="298" rx="6" ry="3" fill="#35903a" opacity="0.55" transform="rotate(20 423 298)"/>
  <ellipse cx="376" cy="370" rx="13" ry="6" fill="#2a7530" opacity="0.82" transform="rotate(-45 376 370)"/>

  <!-- Parmesan shavings -->
  <ellipse cx="430" cy="355" rx="12" ry="4" fill="#f5e8b0" opacity="0.7" transform="rotate(15 430 355)"/>
  <ellipse cx="368" cy="348" rx="10" ry="3" fill="#f0e0a0" opacity="0.65" transform="rotate(-20 368 348)"/>
  <ellipse cx="445" cy="380" rx="9" ry="3" fill="#f2e4a8" opacity="0.6" transform="rotate(30 445 380)"/>

  <!-- Plate rim highlight -->
  <ellipse cx="310" cy="300" rx="20" ry="12" fill="#ffffff" opacity="0.15" transform="rotate(-30 310 300)"/>

  <!-- Ambient particles (steam effect) -->
  <circle cx="395" cy="250" r="3" fill="#c8603a" opacity="0.12"/>
  <circle cx="415" cy="240" r="2" fill="#b85030" opacity="0.1"/>
  <circle cx="380" cy="235" r="2" fill="#c06035" opacity="0.08"/>
</svg>

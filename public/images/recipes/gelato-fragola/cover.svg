<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="ibg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fdf0f0"/>
      <stop offset="100%" stop-color="#f0e0e0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0b060"/>
      <stop offset="100%" stop-color="#c89040"/>
    </linearGradient>
    <radialGradient id="scoop1" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f08090"/>
      <stop offset="100%" stop-color="#d05060"/>
    </radialGradient>
    <radialGradient id="scoop2" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#faf0e0"/>
      <stop offset="100%" stop-color="#f0ddb0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ibg)"/>
  <!-- Soft confetti background -->
  <g opacity="0.06">
    <circle cx="120" cy="100" r="8" fill="#e0508a"/>
    <circle cx="680" cy="80" r="6" fill="#50b0e0"/>
    <circle cx="200" cy="480" r="7" fill="#f0a030"/>
    <circle cx="600" cy="500" r="5" fill="#50c080"/>
    <circle cx="100" cy="300" r="6" fill="#e0508a"/>
    <circle cx="700" cy="350" r="8" fill="#f0a030"/>
    <circle cx="350" cy="80" r="5" fill="#50b0e0"/>
    <circle cx="500" cy="520" r="7" fill="#e0508a"/>
  </g>
  <!-- Shadow -->
  <ellipse cx="400" cy="520" rx="130" ry="25" fill="#d0b0b0" opacity="0.3"/>
  <!-- Waffle cone -->
  <polygon points="340,320 460,320 400,530" fill="url(#cone)"/>
  <!-- Cone texture - diamond pattern -->
  <g stroke="#b07830" stroke-width="1" opacity="0.4">
    <line x1="355" y1="340" x2="445" y2="340"/>
    <line x1="362" y1="370" x2="438" y2="370"/>
    <line x1="370" y1="400" x2="430" y2="400"/>
    <line x1="377" y1="430" x2="423" y2="430"/>
    <line x1="384" y1="460" x2="416" y2="460"/>
    <line x1="391" y1="490" x2="409" y2="490"/>
    <!-- Diagonals -->
    <line x1="355" y1="320" x2="400" y2="530"/>
    <line x1="385" y1="320" x2="400" y2="530"/>
    <line x1="415" y1="320" x2="400" y2="530"/>
    <line x1="445" y1="320" x2="400" y2="530"/>
    <line x1="340" y1="320" x2="400" y2="530"/>
    <line x1="460" y1="320" x2="400" y2="530"/>
  </g>
  <!-- Cone edge highlight -->
  <line x1="340" y1="320" x2="400" y2="530" stroke="#d4a050" stroke-width="2"/>
  <line x1="460" y1="320" x2="400" y2="530" stroke="#b08030" stroke-width="1"/>
  <!-- Bottom scoop - vanilla -->
  <circle cx="400" cy="280" r="70" fill="url(#scoop2)"/>
  <g fill="#f5e8c0" opacity="0.4">
    <ellipse cx="375" cy="265" rx="20" ry="12"/>
    <ellipse cx="420" cy="290" rx="18" ry="10"/>
    <ellipse cx="390" cy="305" rx="15" ry="8"/>
  </g>
  <!-- Vanilla specks -->
  <g fill="#8a7040" opacity="0.15">
    <circle cx="380" cy="270" r="1"/><circle cx="410" cy="285" r="1.2"/>
    <circle cx="395" cy="295" r="0.8"/><circle cx="370" cy="290" r="1"/>
    <circle cx="420" cy="270" r="1"/><circle cx="385" cy="310" r="0.8"/>
  </g>
  <!-- Top scoop - strawberry -->
  <circle cx="400" cy="200" r="75" fill="url(#scoop1)"/>
  <!-- Strawberry texture -->
  <g fill="#c84858" opacity="0.4">
    <ellipse cx="375" cy="185" rx="22" ry="14"/>
    <ellipse cx="420" cy="210" rx="20" ry="12"/>
    <ellipse cx="390" cy="228" rx="18" ry="10"/>
    <ellipse cx="415" cy="178" rx="16" ry="10"/>
  </g>
  <!-- Strawberry seed specks -->
  <g fill="#e8a0a0" opacity="0.3">
    <circle cx="385" cy="180" r="2"/><circle cx="410" cy="195" r="1.8"/>
    <circle cx="375" cy="210" r="1.5"/><circle cx="425" cy="180" r="2"/>
    <circle cx="395" cy="225" r="1.8"/><circle cx="415" cy="220" r="1.5"/>
    <circle cx="370" cy="195" r="1.5"/><circle cx="430" cy="205" r="2"/>
  </g>
  <!-- Fresh strawberry pieces -->
  <g>
    <!-- Strawberry 1 -->
    <path d="M365,168 Q358,155 365,142 Q372,155 365,168Z" fill="#d03040"/>
    <ellipse cx="365" cy="140" rx="4" ry="3" fill="#40a038"/>
    <!-- Strawberry 2 -->
    <path d="M435,192 Q428,179 435,166 Q442,179 435,192Z" fill="#d83848"/>
    <ellipse cx="435" cy="164" rx="4" ry="3" fill="#40a038"/>
  </g>
  <!-- Highlight/shine -->
  <ellipse cx="380" cy="175" rx="18" ry="12" fill="white" opacity="0.15" transform="rotate(-20 380 175)"/>
  <ellipse cx="385" cy="255" rx="14" ry="10" fill="white" opacity="0.1" transform="rotate(-15 385 255)"/>
  <!-- Drip -->
  <path d="M365,320 Q362,340 365,355 Q368,340 365,320Z" fill="#d86070" opacity="0.6"/>
  <path d="M430,318 Q427,332 430,342 Q433,332 430,318Z" fill="#f0ddb0" opacity="0.5"/>
  <!-- Sprinkles on top -->
  <g>
    <rect x="378" y="150" width="8" height="3" rx="1.5" fill="#40b0e0" transform="rotate(-30 382 151)"/>
    <rect x="405" y="155" width="8" height="3" rx="1.5" fill="#f0c030" transform="rotate(20 409 156)"/>
    <rect x="390" y="140" width="7" height="3" rx="1.5" fill="#e04080" transform="rotate(-10 393 141)"/>
    <rect x="415" y="170" width="8" height="3" rx="1.5" fill="#40c070" transform="rotate(40 419 171)"/>
    <rect x="365" y="162" width="7" height="3" rx="1.5" fill="#f08030" transform="rotate(-45 368 163)"/>
    <rect x="425" y="148" width="7" height="3" rx="1.5" fill="#8050d0" transform="rotate(15 428 149)"/>
    <rect x="375" y="145" width="6" height="3" rx="1.5" fill="#40c070" transform="rotate(30 378 146)"/>
    <rect x="410" y="140" width="7" height="3" rx="1.5" fill="#e04080" transform="rotate(-20 413 141)"/>
  </g>
</svg>

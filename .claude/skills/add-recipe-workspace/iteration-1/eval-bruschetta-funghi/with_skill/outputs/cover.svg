<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bfbg" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#2e2822"/><stop offset="100%" stop-color="#1a1510"/></radialGradient>
    <linearGradient id="bfbread" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4a050"/><stop offset="100%" stop-color="#b08030"/></linearGradient>
    <radialGradient id="bfmush" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#8b6e4e"/><stop offset="100%" stop-color="#5a4030"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bfbg)"/>
  <!-- Wood surface -->
  <rect x="0" y="380" width="800" height="220" fill="#3a2818" rx="0"/>
  <g stroke="#2a1a0e" stroke-width="0.8" opacity="0.2">
    <line x1="0" y1="410" x2="800" y2="410"/><line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="490" x2="800" y2="490"/><line x1="0" y1="530" x2="800" y2="530"/>
  </g>
  <!-- Shadow under board -->
  <ellipse cx="400" cy="390" rx="260" ry="18" fill="#0a0806" opacity="0.4"/>
  <!-- Cutting board -->
  <rect x="160" y="210" width="480" height="190" rx="12" fill="#6a4828"/>
  <rect x="160" y="210" width="480" height="190" rx="12" fill="#5a3c20" opacity="0.3"/>
  <g stroke="#4a3018" stroke-width="0.5" opacity="0.25">
    <line x1="170" y1="250" x2="630" y2="250"/><line x1="170" y1="290" x2="630" y2="290"/>
    <line x1="170" y1="330" x2="630" y2="330"/><line x1="170" y1="370" x2="630" y2="370"/>
  </g>
  <!-- Bread slice 1 -->
  <ellipse cx="290" cy="300" rx="100" ry="45" fill="url(#bfbread)"/>
  <ellipse cx="290" cy="295" rx="92" ry="38" fill="#c89840"/>
  <g stroke="#8a6020" stroke-width="2.5" opacity="0.35">
    <line x1="215" y1="285" x2="365" y2="285"/><line x1="218" y1="300" x2="362" y2="300"/>
    <line x1="215" y1="315" x2="365" y2="315"/>
  </g>
  <!-- Mushroom slices on bread 1 -->
  <g>
    <ellipse cx="260" cy="278" rx="18" ry="8" fill="url(#bfmush)" transform="rotate(-10 260 278)"/>
    <ellipse cx="285" cy="273" rx="20" ry="9" fill="#7a5e3e" transform="rotate(5 285 273)"/>
    <ellipse cx="312" cy="278" rx="17" ry="8" fill="url(#bfmush)" transform="rotate(-8 312 278)"/>
    <ellipse cx="270" cy="290" rx="19" ry="8" fill="#7a5e3e" transform="rotate(12 270 290)"/>
    <ellipse cx="300" cy="287" rx="18" ry="7" fill="url(#bfmush)" transform="rotate(-5 300 287)"/>
    <ellipse cx="325" cy="290" rx="16" ry="7" fill="#7a5e3e" transform="rotate(8 325 290)"/>
  </g>
  <!-- Mushroom gill lines -->
  <g stroke="#5a4030" stroke-width="0.6" opacity="0.3">
    <line x1="252" y1="276" x2="268" y2="280"/><line x1="278" y1="271" x2="292" y2="275"/>
    <line x1="305" y1="276" x2="319" y2="280"/>
  </g>
  <!-- Bread slice 2 -->
  <ellipse cx="510" cy="300" rx="100" ry="45" fill="url(#bfbread)"/>
  <ellipse cx="510" cy="295" rx="92" ry="38" fill="#c89840"/>
  <g stroke="#8a6020" stroke-width="2.5" opacity="0.35">
    <line x1="435" y1="285" x2="585" y2="285"/><line x1="438" y1="300" x2="582" y2="300"/>
    <line x1="435" y1="315" x2="585" y2="315"/>
  </g>
  <!-- Mushroom slices on bread 2 -->
  <g>
    <ellipse cx="480" cy="278" rx="18" ry="8" fill="url(#bfmush)" transform="rotate(10 480 278)"/>
    <ellipse cx="505" cy="273" rx="20" ry="9" fill="#7a5e3e" transform="rotate(-5 505 273)"/>
    <ellipse cx="532" cy="278" rx="17" ry="8" fill="url(#bfmush)" transform="rotate(8 532 278)"/>
    <ellipse cx="490" cy="290" rx="19" ry="8" fill="#7a5e3e" transform="rotate(-12 490 290)"/>
    <ellipse cx="520" cy="287" rx="18" ry="7" fill="url(#bfmush)" transform="rotate(5 520 287)"/>
    <ellipse cx="545" cy="290" rx="16" ry="7" fill="#7a5e3e" transform="rotate(-8 545 290)"/>
  </g>
  <g stroke="#5a4030" stroke-width="0.6" opacity="0.3">
    <line x1="472" y1="276" x2="488" y2="280"/><line x1="498" y1="271" x2="512" y2="275"/>
    <line x1="525" y1="276" x2="539" y2="280"/>
  </g>
  <!-- Parsley leaves -->
  <g transform="translate(275, 270) rotate(-20)"><path d="M0,0 Q-7,-12 0,-20 Q7,-12 0,0Z" fill="#2d7a2d"/></g>
  <g transform="translate(320, 282) rotate(15)"><path d="M0,0 Q-6,-10 0,-17 Q6,-10 0,0Z" fill="#35882e"/></g>
  <g transform="translate(495, 270) rotate(20)"><path d="M0,0 Q-7,-12 0,-20 Q7,-12 0,0Z" fill="#2d7a2d"/></g>
  <g transform="translate(540, 282) rotate(-15)"><path d="M0,0 Q-6,-10 0,-17 Q6,-10 0,0Z" fill="#35882e"/></g>
  <!-- Garlic cloves -->
  <ellipse cx="185" cy="350" rx="10" ry="14" fill="#e8dcc8" transform="rotate(-25 185 350)" opacity="0.7"/>
  <ellipse cx="200" cy="355" rx="9" ry="12" fill="#e0d4c0" transform="rotate(10 200 355)" opacity="0.6"/>
  <!-- Oil drizzle -->
  <g stroke="#c0a020" stroke-width="1.2" fill="none" opacity="0.2">
    <path d="M255,275 Q275,265 300,273"/><path d="M475,275 Q495,265 520,273"/>
  </g>
  <!-- Scattered crumbs -->
  <circle cx="220" cy="370" r="1.5" fill="#c89840" opacity="0.15"/>
  <circle cx="580" cy="365" r="1" fill="#c89840" opacity="0.12"/>
  <circle cx="350" cy="385" r="1.2" fill="#c89840" opacity="0.1"/>
  <circle cx="450" cy="375" r="1" fill="#c89840" opacity="0.15"/>
</svg>

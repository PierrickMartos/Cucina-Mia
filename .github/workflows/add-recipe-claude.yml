name: Add Recipe via Claude Code

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  add-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Process recipe with Claude Code
        id: process_recipe
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /add-recipe You are processing a recipe submission from GitHub issue #${{ github.event.issue.number }}.
            Fetch and classify issue using: gh issue view ${{ github.event.issue.number }} --json title,body,labels

            When completed:
            1. Create a branch named recipe/{slug} (e.g. recipe/pasta-carbonara), commit all new/modified files to it, and push the branch
            2. Open a pull request from that branch to main with title "feat: add {recipe title}" and a body summarising the recipe (title, category, difficulty, ingredient count, step count, languages)
            3. Comment on issue #${{ github.event.issue.number }} with the PR URL so the submitter can follow along

            If there are errors (missing required fields, duplicate slug, unreadable file/URL),
            comment on the issue explaining the problem and do NOT create a branch or PR.
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch"

      - name: Save Claude execution logs
        if: always()
        run: cp /home/runner/work/_temp/claude-execution-output.json /tmp/claude-log-add-recipe.json 2>/dev/null || true

      - name: Upload Claude execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-logs-issue-${{ github.event.issue.number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/claude-log-add-recipe.json

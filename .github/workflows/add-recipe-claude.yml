name: Add Recipe via Claude Code

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  add-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Process recipe with Claude Code
        id: process_recipe
        uses: anthropics/claude-code-action@v1
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /add-recipe You are processing a recipe submission from GitHub issue #${{ github.event.issue.number }}.
            Fetch and classify issue using: gh issue view ${{ github.event.issue.number }} --json title,body,labels

            When completed:
            1. Create a branch named recipe/{slug} (e.g. recipe/pasta-carbonara), commit all new/modified files to it, and push the branch
              - Check for an open PR: gh pr list --head recipe/{slug} --state open --json number,url
              - If a PR is open and local files match remote HEAD, skip push and use the existing PR URL for step 3
              - Otherwise force-push: git push --force-with-lease origin recipe/{slug}
            2. Open a pull request from that branch to main with title "feat: add {recipe title}" and a body summarising the recipe (title, category, difficulty, ingredient count, step count, languages)
            3. Comment on issue #${{ github.event.issue.number }} with the PR URL so the submitter can follow along

            If there are errors (missing required fields, duplicate slug, unreadable file/URL),
            comment on the issue explaining the problem and do NOT create a branch or PR.
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch"

      - name: Upload Claude execution logs
        if: always() && steps.process_recipe.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-logs-issue-${{ github.event.issue.number }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ steps.process_recipe.outputs.execution_file }}

      - name: Add workflow summary
        if: always()
        run: |
          echo "## Claude Code run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: ${{ github.workflow }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run number: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Issue: #${{ github.event.issue.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Claude result: ${{ steps.process_recipe.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Display Claude Code Report
        if: always() && steps.process_recipe.outputs.execution_file != ''
        shell: bash
        run: |
          EXEC_FILE="${{ steps.process_recipe.outputs.execution_file }}"
          if [ -f "$EXEC_FILE" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Claude Code Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details>" >> "$GITHUB_STEP_SUMMARY"
            echo "<summary>Full execution log (click to expand)</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$EXEC_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note:** No execution log file found at \`$EXEC_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Claude PR Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event.issue.pull_request || github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch"

      - name: Upload Claude execution logs
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-logs-${{ github.event.comment.id }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ steps.claude.outputs.execution_file }}

      - name: Add workflow summary
        if: always()
        run: |
          echo "## Claude Code run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: ${{ github.workflow }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run number: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Comment: ${{ github.event.comment.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Claude result: ${{ steps.claude.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Display Claude Code Report
        if: always() && steps.claude.outputs.execution_file != ''
        shell: bash
        run: |
          EXEC_FILE="${{ steps.claude.outputs.execution_file }}"
          if [ -f "$EXEC_FILE" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Claude Code Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details>" >> "$GITHUB_STEP_SUMMARY"
            echo "<summary>Full execution log (click to expand)</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$EXEC_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note:** No execution log file found at \`$EXEC_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          fi

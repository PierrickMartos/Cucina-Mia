name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/Cucina-Mia/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Preserve PR preview directories
        run: |
          git fetch origin gh-pages || true
          if git show origin/gh-pages:pr-preview 2>/dev/null; then
            mkdir -p dist/pr-preview
            git archive origin/gh-pages -- pr-preview/ | tar -x -C dist/
          fi

      - name: Deploy to gh-pages branch
        id: deploy_attempt_1
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # A PR preview may have been pushed to gh-pages in the meantime:
      # re-copy the previews so the new one is kept, then retry once
      - name: Re-preserve PR preview directories
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: |
          sleep 20
          rm -rf dist/pr-preview
          git fetch origin gh-pages
          if git show origin/gh-pages:pr-preview 2>/dev/null; then
            mkdir -p dist/pr-preview
            git archive origin/gh-pages -- pr-preview/ | tar -x -C dist/
          fi

      - name: Deploy to gh-pages branch (retry)
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
